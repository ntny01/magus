<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Új jelszó — KODEXIUM</title>
  <meta name="theme-color" content="#020617">
  <link rel="icon" href="assets/logo/compass-logo.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');
    :root{--bg:#020617;--card:#0f172a;--border:rgba(212,175,55,0.18);--text:#e2e8f0;--muted:#94a3b8;--gold:#d4af37;--accent-h:#34d399;--red:#f87171;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:radial-gradient(ellipse at 50% 30%,rgba(212,175,55,.06) 0%,transparent 45%),linear-gradient(160deg,#020617,#050e1f 55%,#020a14);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem;}
    .logo-title{font-family:'Cinzel',serif;color:var(--gold);font-size:2rem;letter-spacing:.18em;text-shadow:0 0 40px rgba(212,175,55,.3);margin-bottom:.3rem;}
    .logo-sub{font-family:'Cinzel',serif;color:var(--muted);font-size:.75rem;letter-spacing:.25em;text-transform:uppercase;margin-bottom:2rem;}
    .card{background:rgba(15,23,42,0.92);border:1px solid var(--border);border-radius:1.25rem;padding:2rem 2.25rem;width:100%;max-width:420px;box-shadow:0 25px 60px rgba(0,0,0,.5);}
    h1{font-family:'Cinzel',serif;color:var(--gold);font-size:1.3rem;letter-spacing:.06em;margin-bottom:1.25rem;text-align:center;}
    .field{margin-bottom:1.1rem;}
    .field label{display:block;font-size:.75rem;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:.4rem;}
    .field input{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:.6rem;color:var(--text);font-family:'Inter',sans-serif;font-size:.9rem;padding:.65rem .9rem;outline:none;transition:border-color .18s,box-shadow .18s;}
    .field input:focus{border-color:rgba(212,175,55,0.4);box-shadow:0 0 0 3px rgba(212,175,55,0.08);}
    .btn-submit{width:100%;background:linear-gradient(135deg,rgba(212,175,55,0.15),rgba(212,175,55,0.08));border:1px solid rgba(212,175,55,0.3);color:var(--gold);font-family:'Cinzel',serif;font-size:.85rem;letter-spacing:.1em;padding:.75rem;border-radius:.75rem;cursor:pointer;transition:all .2s;}
    .btn-submit:hover{background:linear-gradient(135deg,rgba(212,175,55,0.25),rgba(212,175,55,0.15));border-color:rgba(212,175,55,0.5);}
    .btn-submit:disabled{opacity:.5;cursor:not-allowed;}
    .msg{font-size:.82rem;padding:.65rem .9rem;border-radius:.6rem;margin-bottom:1rem;display:none;line-height:1.5;}
    .msg.error{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.25);color:var(--red);display:block;}
    .msg.success{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.25);color:var(--accent-h);display:block;}
    .msg.info{background:rgba(212,175,55,0.08);border:1px solid rgba(212,175,55,0.2);color:var(--gold);display:block;}
    .foot{margin-top:1rem;text-align:center;}
    .foot a{color:var(--muted);font-size:.8rem;text-decoration:none;}
  </style>
</head>
<body>
  <div class="logo-title">KODEXIUM</div>
  <div class="logo-sub">Jelszó visszaállítás</div>

  <div class="card">
    <h1>Új jelszó megadása</h1>
    <div id="msg" class="msg"></div>

    <div id="form" style="display:none;">
      <div class="field">
        <label>Új jelszó</label>
        <input type="password" id="new-pass" placeholder="min. 8 karakter, betű + szám" autocomplete="new-password">
      </div>
      <div class="field">
        <label>Új jelszó újra</label>
        <input type="password" id="new-pass2" placeholder="••••••••" autocomplete="new-password">
      </div>
      <button class="btn-submit" onclick="doReset()">Jelszó mentése</button>
    </div>

    <div id="waiting" style="color:var(--muted);font-size:.85rem;text-align:center;">Link ellenőrzése…</div>

    <div class="foot"><a href="login">← Vissza a belépéshez</a></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://nmzdvsnoomusukkczuav.supabase.co'
    const SUPABASE_ANON_KEY = 'sb_publishable_JCRzD-ElN1os72wkfX_DKw_PoOTgnYR'
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    function showMsg(type, text){ const el = document.getElementById('msg'); el.className = 'msg ' + type; el.textContent = text }
    function showForm(){ document.getElementById('waiting').style.display = 'none'; document.getElementById('form').style.display = 'block' }

    let ready = false
    // A visszaállító link a URL-hash-ben hozza a tokent; a kliens auto-feldolgozza
    // és PASSWORD_RECOVERY eseményt küld -> ilyenkor engedjük az új jelszót.
    sb.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') { ready = true; showForm() }
    })

    // Tartalék: ha 2 mp-en belül nem jött recovery-esemény, nézzük a sessiont.
    setTimeout(async () => {
      if (ready) return
      const { data: { session } } = await sb.auth.getSession()
      if (session) { ready = true; showForm() }
      else {
        document.getElementById('waiting').style.display = 'none'
        showMsg('info', 'Ez az oldal csak a jelszó-visszaállító e-mailben kapott linkről nyitható meg. Kérj új linket a belépésnél.')
      }
    }, 2000)

    async function doReset(){
      const p1 = document.getElementById('new-pass').value
      const p2 = document.getElementById('new-pass2').value
      if (p1.length < 8 || !/[a-zA-Z]/.test(p1) || !/[0-9]/.test(p1)) { showMsg('error', 'A jelszó legalább 8 karakter legyen, betűvel és számmal.'); return }
      if (p1 !== p2) { showMsg('error', 'A két jelszó nem egyezik.'); return }
      const btn = document.querySelector('.btn-submit')
      btn.disabled = true; btn.textContent = 'Mentés...'
      const { error } = await sb.auth.updateUser({ password: p1 })
      if (error) { showMsg('error', 'Hiba: ' + error.message); btn.disabled = false; btn.textContent = 'Jelszó mentése'; return }
      showMsg('success', 'Jelszó módosítva! Átirányítás a belépéshez…')
      await sb.auth.signOut()
      setTimeout(() => location.href = 'login', 1800)
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter' && document.getElementById('form').style.display !== 'none') doReset() })
  </script>
</body>
</html>
