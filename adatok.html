<!DOCTYPE html>
<html lang="hu">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (async () => {
            const sb = supabase.createClient(
                'https://nmzdvsnoomusukkczuav.supabase.co',
                'sb_publishable_JCRzD-ElN1os72wkfX_DKw_PoOTgnYR'
            );
            window._sb = sb;
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { window.location.href = 'login'; return; }
            window._userId = session.user.id;
            window._userProfile = { display_name: (session.user.email || '') };
            try {
                const { data: profile } = await sb.from('user_profiles')
                    .select('display_name').eq('id', session.user.id).single();
                if (profile) window._userProfile = profile;
            } catch (e) {}
            window._authReady = true;
            window.dispatchEvent(new Event('magus-auth-ready'));
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adatbázis</title>
    <meta name="theme-color" content="#020617">
    <link rel="icon" href="assets/logo/compass-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="magus_ui.css?v=1">
    <style>
        :root {
            --bg: #0d0e13; --panel: #16171e; --panel-2: #1c1e27;
            --border: #2a2c38; --border-2: #3a3d4d;
            --text: #e6e7ee; --muted: #9498a8;
            --accent: #e0b84a; --accent-soft: rgba(224,184,74,.12);
            --danger: #f87171; --danger-soft: rgba(248,113,113,.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        *{scrollbar-width:thin;scrollbar-color:rgba(224,184,74,.35) transparent}
        *::-webkit-scrollbar{width:8px;height:8px}
        *::-webkit-scrollbar-thumb{background:rgba(224,184,74,.3);border-radius:5px}
        html { background: var(--bg); color-scheme: dark; overscroll-behavior-y: none; }
        body { font-family: 'Inter','Segoe UI',sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; overflow-x: clip; }

        header {
            display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
            padding: .6rem .9rem; border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 20; background: rgba(13,14,19,.92);
        }
        .back-btn { color: var(--muted); text-decoration: none; padding: .35rem .55rem; border-radius: .45rem; border: 1px solid transparent; }
        .back-btn:hover { color: var(--text); border-color: var(--border); }
        .brand { font-family: 'Cinzel',serif; font-weight: 700; }
        .brand .d { color: var(--accent); }
        .h-spacer { flex: 1 1 auto; }
        .user-chip { display: flex; align-items: center; gap: .5rem; }
        .user-chip .un { font-size: .8rem; color: var(--muted); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        main { max-width: 1080px; margin: 0 auto; padding: 1rem; }
        .lock-note { font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: .4rem; margin-bottom: 1rem; }
        .lock-note b { color: var(--accent); }

        .denied, .loading { text-align: center; padding: 3rem 1rem; color: var(--muted); }
        .denied b { color: var(--danger); }

        .totals { display: flex; gap: 1.2rem; flex-wrap: wrap; margin-bottom: 1rem; padding: .8rem 1rem; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
        .totals .tk { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
        .totals .tv { font-family: 'Cinzel',serif; font-size: 1.3rem; color: var(--accent); }

        .tbl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: .6rem; }
        .tcard {
            background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
            padding: .7rem .8rem; cursor: pointer; transition: border-color .12s, transform .06s;
        }
        .tcard:hover { border-color: var(--accent); }
        .tcard.active { border-color: var(--accent); background: var(--accent-soft); }
        .tcard .tn { font-family: 'Inter',sans-serif; font-weight: 600; font-size: .9rem; word-break: break-all; }
        .tcard .tmeta { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); margin: .35rem 0 .4rem; }
        .tcard .tmeta .rows { color: var(--text); }
        .bar { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
        .bar > span { display: block; height: 100%; background: linear-gradient(90deg,#cf9f30,#e6c258); }
        .tcard.empty .tn { color: var(--muted); }

        .detail { margin-top: 1.3rem; }
        .detail-head { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin-bottom: .7rem; }
        .detail-head h2 { font-family: 'Cinzel',serif; font-size: 1.1rem; color: var(--accent); }
        .detail-head .cnt { color: var(--muted); font-size: .85rem; }
        .mini-btn { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border-2); border-radius: .5rem; padding: .4rem .7rem; font-size: .8rem; cursor: pointer; font-family: inherit; }
        .mini-btn:hover { color: var(--text); border-color: var(--accent); }
        .del-btn { background: var(--danger-soft); color: var(--danger); border: 1px solid rgba(248,113,113,.3); border-radius: .5rem; padding: .4rem .7rem; font-size: .8rem; cursor: pointer; font-family: inherit; }
        .del-btn:hover { background: rgba(248,113,113,.2); }
        .del-btn:disabled { opacity: .4; cursor: not-allowed; }

        .rows { display: flex; flex-direction: column; gap: .4rem; }
        .rowc { display: flex; gap: .6rem; align-items: flex-start; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: .55rem .7rem; }
        .rowc.sel { border-color: var(--accent); background: var(--accent-soft); }
        .rowc input[type=checkbox] { margin-top: .2rem; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
        .rowc .rm { flex: 1; min-width: 0; }
        .rowc .rh { font-size: .85rem; display: flex; gap: .5rem; flex-wrap: wrap; align-items: baseline; }
        .rowc .rh .rlabel { font-weight: 600; }
        .rowc .rh .rid { color: var(--muted); font-size: .72rem; font-family: ui-monospace, monospace; }
        .rowc .rh .rdate { color: var(--muted); font-size: .72rem; margin-left: auto; }
        .rowc details { margin-top: .35rem; }
        .rowc summary { cursor: pointer; color: var(--muted); font-size: .76rem; }
        .rowc pre { margin-top: .4rem; background: var(--bg); border: 1px solid var(--border); border-radius: .5rem; padding: .5rem .6rem; font-size: .72rem; overflow-x: auto; color: #cbd5e1; white-space: pre-wrap; word-break: break-word; }
        .rowx { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1rem; padding: .1rem .3rem; flex: none; }
        .rowx:hover { color: #fca5a5; }
        .empty-rows { color: var(--muted); font-size: .85rem; padding: 1rem; text-align: center; }
        .more-wrap { text-align: center; margin-top: .6rem; }
    </style>
</head>
<body>
    <header>
        <a class="back-btn" href="index" title="Vissza a főoldalra" aria-label="Vissza a főoldalra">◀&#xFE0E;</a>
        <span class="brand"><span class="d">🗄️</span> Adatbázis</span>
        <div class="h-spacer"></div>
        <div class="user-chip"><span class="un" id="userName"></span><button class="mg-btn mg-btn--danger" onclick="doLogout()">Kilépés</button></div>
    </header>

    <main>
        <div class="lock-note">🔒 Zár: <b id="lockWho">a te accountod</b> · a lap az adatbázis RLS-ére támaszkodik (nem a lap titkosságára).</div>
        <div id="loading" class="loading">Betöltés…</div>
        <div id="denied" class="denied" style="display:none"><b>Nincs jogosultság.</b><br>Ezt az oldalt csak a tulajdonos account nyithatja meg.</div>
        <div id="content" style="display:none">
            <div class="totals">
                <div><div class="tk">Táblák</div><div class="tv" id="totTables">—</div></div>
                <div><div class="tk">Összes sor</div><div class="tv" id="totRows">—</div></div>
                <div><div class="tk">Foglalt méret</div><div class="tv" id="totBytes">—</div></div>
            </div>
            <div class="tbl-grid" id="tblGrid"></div>
            <div class="detail" id="detail" style="display:none">
                <div class="detail-head">
                    <h2 id="dTitle"></h2>
                    <span class="cnt" id="dCnt"></span>
                    <div class="h-spacer"></div>
                    <button class="mini-btn" id="dRefresh">Frissítés</button>
                    <button class="del-btn" id="dBulk" disabled>Kijelöltek törlése</button>
                </div>
                <div class="rows" id="dRows"></div>
                <div class="more-wrap"><button class="mini-btn" id="dMore" style="display:none">Több sor betöltése</button></div>
            </div>
        </div>
    </main>

    <script>
    (function () {
        var ST = { stats: [], byTable: {}, cur: null, rows: [], offset: 0, sel: {}, pk: [] };
        var PAGE = 200;
        var $ = function (id) { return document.getElementById(id); };
        function sb() { return window._sb; }
        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
        function humanBytes(n) { n = +n || 0; if (n < 1024) return n + ' B'; var u = ['KB', 'MB', 'GB', 'TB'], i = -1; do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1); return (n < 10 ? n.toFixed(1) : Math.round(n)) + ' ' + u[i]; }
        function numf(n) { return (+n || 0).toLocaleString('hu-HU'); }

        window.doLogout = function () { try { sb().auth.signOut(); } catch (e) {} window.location.href = 'login'; };

        function boot() {
            $('userName').textContent = (window._userProfile && window._userProfile.display_name) || '';
            loadStats();
        }

        function loadStats() {
            sb().rpc('admin_db_stats').then(function (r) {
                $('loading').style.display = 'none';
                if (r.error) { $('denied').style.display = 'block'; return; }
                var data = r.data || [];
                if (typeof data === 'string') { try { data = JSON.parse(data); } catch (e) { data = []; } }
                ST.stats = data; ST.byTable = {};
                data.forEach(function (t) { ST.byTable[t.table] = t; });
                $('content').style.display = 'block';
                renderOverview();
            });
        }

        function renderOverview() {
            var rowsTotal = 0, bytesTotal = 0, maxBytes = 1;
            ST.stats.forEach(function (t) { rowsTotal += +t.rows || 0; bytesTotal += +t.bytes || 0; if (+t.bytes > maxBytes) maxBytes = +t.bytes; });
            $('totTables').textContent = ST.stats.length;
            $('totRows').textContent = numf(rowsTotal);
            $('totBytes').textContent = humanBytes(bytesTotal);
            var grid = $('tblGrid'); grid.innerHTML = '';
            ST.stats.slice().sort(function (a, b) { return (b.bytes - a.bytes) || (b.rows - a.rows); }).forEach(function (t) {
                var pct = Math.max(2, Math.round((+t.bytes / maxBytes) * 100));
                var el = document.createElement('div');
                el.className = 'tcard' + ((+t.rows === 0) ? ' empty' : '') + (ST.cur === t.table ? ' active' : '');
                el.innerHTML = '<div class="tn">' + esc(t.table) + '</div>' +
                    '<div class="tmeta"><span class="rows">' + numf(t.rows) + ' sor</span><span>' + humanBytes(t.bytes) + '</span></div>' +
                    '<div class="bar"><span style="width:' + pct + '%"></span></div>';
                el.onclick = function () { openTable(t.table); };
                grid.appendChild(el);
            });
        }

        function openTable(table) {
            ST.cur = table; ST.rows = []; ST.offset = 0; ST.sel = {};
            ST.pk = (ST.byTable[table] && ST.byTable[table].pk) || [];
            renderOverview();
            $('detail').style.display = 'block';
            $('dTitle').textContent = table;
            $('dRows').innerHTML = '<div class="empty-rows">Betöltés…</div>';
            $('detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
            loadRows(true);
        }

        function loadRows(reset) {
            var table = ST.cur;
            var q = sb().from(table).select('*').range(ST.offset, ST.offset + PAGE - 1);
            if (ST.pk.length) q = q.order(ST.pk[0], { ascending: true });
            q.then(function (r) {
                if (r.error) { $('dRows').innerHTML = '<div class="empty-rows">⚠️ ' + esc(r.error.message) + '</div>'; return; }
                var data = r.data || [];
                if (reset) ST.rows = [];
                ST.rows = ST.rows.concat(data);
                ST.offset += data.length;
                $('dMore').style.display = (data.length === PAGE) ? 'inline-block' : 'none';
                renderRows();
            });
        }

        var LABEL_KEYS = ['name', 'title', 'label', 'char_name', 'display_name', 'session_name', 'notation', 'item_type'];
        var DATE_KEYS = ['created_at', 'updated_at'];
        function rowKey(row) { return ST.pk.map(function (c) { return row[c]; }).join('¦'); }
        function rowLabel(row) {
            for (var i = 0; i < LABEL_KEYS.length; i++) if (row[LABEL_KEYS[i]] != null && row[LABEL_KEYS[i]] !== '') return String(row[LABEL_KEYS[i]]);
            return '(nincs név)';
        }
        function rowDate(row) {
            for (var i = 0; i < DATE_KEYS.length; i++) if (row[DATE_KEYS[i]]) { var d = new Date(row[DATE_KEYS[i]]); if (!isNaN(d)) return d.toLocaleString('hu-HU'); }
            return '';
        }
        function rowIdStr(row) { return ST.pk.map(function (c) { return c + '=' + row[c]; }).join(', '); }

        function renderRows() {
            $('dCnt').textContent = numf((ST.byTable[ST.cur] || {}).rows || ST.rows.length) + ' sor';
            var box = $('dRows');
            if (!ST.rows.length) { box.innerHTML = '<div class="empty-rows">Üres tábla.</div>'; updateBulk(); return; }
            var canDel = ST.pk.length > 0;
            box.innerHTML = ST.rows.map(function (row) {
                var k = rowKey(row);
                var seld = ST.sel[k] ? ' sel' : '';
                return '<div class="rowc' + seld + '" data-k="' + esc(k) + '">' +
                    (canDel ? '<input type="checkbox" ' + (ST.sel[k] ? 'checked' : '') + '>' : '<span style="width:16px;flex:none"></span>') +
                    '<div class="rm">' +
                        '<div class="rh"><span class="rlabel">' + esc(rowLabel(row)) + '</span>' +
                        '<span class="rid">' + esc(rowIdStr(row)) + '</span>' +
                        '<span class="rdate">' + esc(rowDate(row)) + '</span></div>' +
                        '<details><summary>Teljes sor</summary><pre>' + esc(JSON.stringify(row, null, 2)) + '</pre></details>' +
                    '</div>' +
                    (canDel ? '<button class="rowx" title="Sor törlése">🗑</button>' : '') +
                '</div>';
            }).join('');
            if (!canDel) return;
            Array.prototype.forEach.call(box.querySelectorAll('.rowc'), function (el) {
                var k = el.getAttribute('data-k');
                var row = ST.rows.filter(function (r) { return rowKey(r) === k; })[0];
                var cb = el.querySelector('input[type=checkbox]');
                if (cb) cb.onchange = function () { if (cb.checked) ST.sel[k] = true; else delete ST.sel[k]; el.classList.toggle('sel', cb.checked); updateBulk(); };
                var x = el.querySelector('.rowx');
                if (x) x.onclick = function () { deleteRows([row]); };
            });
            updateBulk();
        }

        function updateBulk() {
            var n = Object.keys(ST.sel).length;
            var b = $('dBulk');
            b.disabled = n === 0;
            b.textContent = n ? ('Kijelöltek törlése (' + n + ')') : 'Kijelöltek törlése';
        }

        function selectedRows() {
            return ST.rows.filter(function (r) { return ST.sel[rowKey(r)]; });
        }

        function deleteRows(rows) {
            if (!rows.length) return;
            var table = ST.cur;
            // Saját profil védelme: ne tudd kitörölni a saját user_profiles sorodat innen.
            if (table === 'user_profiles') {
                var self = rows.filter(function (r) { return r.id === window._userId; });
                if (self.length) { alert('A saját profilodat (' + window._userId + ') nem törlöd innen — kizárnád magad.'); return; }
            }
            var msg = rows.length === 1
                ? ('Biztosan törlöd ezt a sort a(z) "' + table + '" táblából?\n\n' + rowIdStr(rows[0]) + '\n\nEz NEM vonható vissza.')
                : ('Biztosan törlöd a kijelölt ' + rows.length + ' sort a(z) "' + table + '" táblából?\n\nEz NEM vonható vissza.');
            if (!confirm(msg)) return;

            Promise.all(rows.map(function (row) {
                var q = sb().from(table).delete();
                ST.pk.forEach(function (c) { q = q.eq(c, row[c]); });
                return q.then(function (r) { return { row: row, error: r.error }; });
            })).then(function (res) {
                var failed = res.filter(function (x) { return x.error; });
                if (failed.length) alert(failed.length + ' sor törlése nem sikerült. Első hiba: ' + failed[0].error.message);
                // sikeres sorok kivétele a listából
                var okKeys = {};
                res.forEach(function (x) { if (!x.error) okKeys[rowKey(x.row)] = true; });
                ST.rows = ST.rows.filter(function (r) { return !okKeys[rowKey(r)]; });
                Object.keys(okKeys).forEach(function (k) { delete ST.sel[k]; });
                if (ST.byTable[ST.cur]) ST.byTable[ST.cur].rows = Math.max(0, (+ST.byTable[ST.cur].rows || 0) - Object.keys(okKeys).length);
                renderRows();
                renderOverview();
            });
        }

        $('dRefresh').onclick = function () { if (ST.cur) openTable(ST.cur); };
        $('dBulk').onclick = function () { deleteRows(selectedRows()); };
        $('dMore').onclick = function () { loadRows(false); };

        if (window._authReady) boot();
        else window.addEventListener('magus-auth-ready', boot, { once: true });
    })();
    </script>
</body>
</html>
