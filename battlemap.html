<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Battlemap</title>
  <meta name="theme-color" content="#020617">
<link rel="icon" href="assets/logo/compass-logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Admin-kapu: a szerkesztőt csak admin nyithatja meg. A tényleges védelmet a
  // Supabase RLS adja (ld. security/battlemap_rls.sql) — ez itt csak UX-réteg.
  const sb = supabase.createClient(
    'https://nmzdvsnoomusukkczuav.supabase.co',
    'sb_publishable_JCRzD-ElN1os72wkfX_DKw_PoOTgnYR'
  );
  window._sb = sb;
  window._authReady = (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'login'; return null; }
    const { data: profile } = await sb.from('user_profiles')
      .select('status, role, display_name').eq('id', session.user.id).single();
    if (!profile || profile.status !== 'active') {
      await sb.auth.signOut(); window.location.href = 'login'; return null;
    }
    if (profile.role !== 'admin') { window.location.href = 'index'; return null; }
    window._userProfile = profile;
    window._userId = session.user.id;
    document.documentElement.classList.add('authed');
    return profile;
  })();
</script>
<script src="https://unpkg.com/konva@9/konva.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e1a; --panel:#141a2b; --panel2:#0f1626; --panel3:#1b2437;
    --border:#26314a; --border2:#33405e;
    --gold:#d9b45b; --gold2:#f0d488; --green:#4ade80; --accent:#8b7dd8;
    --text:#e7ecf5; --muted:#8a97b0; --muted2:#5f6c85;
  }
  *{box-sizing:border-box}
  /* Közös „ADMIN" plecsni — jelzi, hogy ez KM-elérésű oldal (a Műhelyről átvéve) */
  .admin-badge{display:inline-block;vertical-align:middle;font-size:.6rem;font-weight:700;letter-spacing:.1em;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.3);color:#a855f7;padding:.15rem .5rem;border-radius:.35rem;text-transform:uppercase}
  html,body{margin:0;height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
  body{display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#2a3550;border-radius:6px}
  ::-webkit-scrollbar-thumb:hover{background:#3a4560}

  /* ---------- TOP BAR ---------- */
  .topbar{
    height:50px;display:flex;align-items:center;gap:10px;padding:0 14px;flex-shrink:0;
    background:linear-gradient(180deg,#121a2e,#0b1120);
    border-bottom:1px solid var(--border);z-index:20;
    box-shadow:0 2px 14px rgba(0,0,0,.4);
  }
  .brand{font-family:'Cinzel',serif;color:var(--gold);font-weight:700;font-size:1.02rem;letter-spacing:.06em;display:flex;align-items:center;gap:7px}
  .brand .pip{font-size:.55rem;color:var(--muted2);border:1px solid var(--border2);padding:2px 6px;border-radius:20px;letter-spacing:.12em;font-family:'Inter'}
  .topsep{width:1px;height:24px;background:var(--border);margin:0 3px}
  .spacer{flex:1}
  .tbtn{
    background:var(--panel3);border:1px solid var(--border);color:var(--text);
    padding:7px 12px;border-radius:9px;cursor:pointer;font-size:.78rem;font-weight:500;white-space:nowrap;
    transition:.14s;display:inline-flex;align-items:center;gap:6px;
  }
  .tbtn:hover{background:#232f48;border-color:var(--border2);transform:translateY(-1px)}
  .tbtn.danger:hover{background:rgba(248,113,113,.14);border-color:rgba(248,113,113,.4);color:#fecaca}
  .tbtn.on{background:rgba(217,180,91,.15);border-color:var(--gold);color:var(--gold2)}
  .count{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}

  /* ---------- WORKSPACE ---------- */
  .workspace{flex:1;display:flex;min-height:0}

  /* Tool rail */
  .toolrail{
    width:60px;flex-shrink:0;background:linear-gradient(180deg,#111827,#0c1220);
    border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;z-index:10;
  }
  .tool{
    width:44px;height:44px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--muted);
    cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;transition:.14s;position:relative;
  }
  .tool:hover{background:var(--panel3);color:var(--text)}
  .tool.on{background:linear-gradient(160deg,#2a3350,#1a2138);border-color:var(--gold);color:var(--gold2);box-shadow:0 4px 14px rgba(217,180,91,.15)}
  .tool .lbl{
    position:absolute;left:52px;top:50%;transform:translateY(-50%) translateX(-6px);opacity:0;pointer-events:none;
    background:#0b1220;border:1px solid var(--border2);color:var(--text);font-size:.7rem;padding:4px 9px;border-radius:7px;white-space:nowrap;transition:.14s;z-index:30;
  }
  .tool:hover .lbl{opacity:1;transform:translateY(-50%) translateX(0)}
  .railsep{width:26px;height:1px;background:var(--border);margin:3px 0}

  /* Library panel */
  .library{
    width:226px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;overflow:hidden;z-index:9;
  }
  .lib-head{padding:13px 14px 9px;border-bottom:1px solid var(--border)}
  .lib-title{font-family:'Cinzel',serif;font-size:.9rem;color:var(--gold);font-weight:600;letter-spacing:.03em}
  .lib-sub{font-size:.68rem;color:var(--muted);margin-top:2px}
  .lib-body{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:14px}
  .lib-sec-title{font-size:.62rem;letter-spacing:.11em;text-transform:uppercase;color:var(--muted2);font-weight:600;margin-bottom:-4px}

  .tabs{display:flex;gap:5px;flex-wrap:wrap}
  .tab{font-size:.7rem;padding:5px 10px;border-radius:20px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);cursor:pointer;transition:.13s}
  .tab:hover{color:var(--text);border-color:var(--border2)}
  .tab.on{background:rgba(217,180,91,.14);border-color:var(--gold);color:var(--gold2)}

  .swgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .sw{
    aspect-ratio:1;border-radius:10px;border:1px solid var(--border);background:var(--panel2);cursor:pointer;
    overflow:hidden;transition:.13s;position:relative;display:flex;align-items:center;justify-content:center;
  }
  .sw:hover{border-color:var(--green);transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.4)}
  .sw.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(217,180,91,.35)}
  .sw img{width:100%;height:100%;object-fit:cover;pointer-events:none}
  .sw.el img{object-fit:contain;padding:7px}
  .sw .cap{position:absolute;bottom:0;left:0;right:0;font-size:.55rem;text-align:center;background:rgba(8,12,22,.72);color:var(--muted);padding:2px 0}

  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:.68rem;color:var(--muted);display:flex;justify-content:space-between}
  .field input[type=range]{width:100%;accent-color:var(--gold)}
  .bgrow{display:flex;gap:6px;flex-wrap:wrap}
  .bgsw{width:24px;height:24px;border-radius:7px;border:2px solid var(--border);cursor:pointer;transition:.12s}
  .bgsw:hover{border-color:#fff;transform:scale(1.08)}
  .lib-empty{color:var(--muted2);font-size:.76rem;line-height:1.5;text-align:center;padding:24px 6px}
  .lib-tip{font-size:.72rem;line-height:1.45;color:var(--gold2);background:rgba(217,180,91,.08);border:1px solid rgba(217,180,91,.22);border-radius:9px;padding:8px 10px}

  /* Stage */
  .stage-wrap{flex:1;position:relative;min-height:0;background:radial-gradient(circle at 50% 30%,#0e1424,#080b14)}
  #canvas{position:absolute;inset:0}
  .hint{
    position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:5;
    background:rgba(11,17,32,.9);border:1px solid var(--border2);border-radius:22px;
    padding:7px 16px;font-size:.72rem;color:var(--muted);white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;
    box-shadow:0 6px 20px rgba(0,0,0,.4);
  }
  .zoombar{position:absolute;bottom:12px;right:12px;z-index:5;display:flex;gap:6px}
  .toast{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:20;background:rgba(74,222,128,.14);
    border:1px solid rgba(74,222,128,.4);color:var(--green);font-size:.8rem;padding:9px 16px;border-radius:10px;
    opacity:0;transition:opacity .35s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  /* Amíg az admin-ellenőrzés le nem fut, ne villanjon fel a szerkesztő. */
  body{visibility:hidden}
  html.authed body{visibility:visible}

  /* ===== Modálok (mentés névvel / betöltés listából) ===== */
  .mask{
    position:fixed;inset:0;background:rgba(3,7,18,.72);backdrop-filter:blur(3px);
    z-index:100;display:none;align-items:center;justify-content:center;padding:20px;
  }
  .mask.open{display:flex}
  .dlg{
    background:var(--panel);border:1px solid var(--border2);border-radius:14px;
    width:min(560px,100%);max-height:82vh;display:flex;flex-direction:column;
    box-shadow:0 24px 60px rgba(0,0,0,.6);overflow:hidden;
  }
  .dlg-head{padding:15px 18px 11px;border-bottom:1px solid var(--border)}
  .dlg-title{font-family:Cinzel,serif;font-size:1rem;color:var(--gold2);letter-spacing:.03em}
  .dlg-sub{font-size:.72rem;color:var(--muted);margin-top:3px}
  .dlg-body{padding:15px 18px;overflow:auto}
  .dlg-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
  .dlg input[type=text]{
    width:100%;background:#0b1220;border:1px solid var(--border2);border-radius:9px;
    color:var(--text);font-size:.85rem;padding:10px 12px;font-family:inherit;
  }
  .dlg input[type=text]:focus{outline:none;border-color:var(--gold)}
  .dlg label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:6px}
  .maplist{display:flex;flex-direction:column;gap:7px}
  .maprow{
    display:flex;gap:11px;align-items:center;padding:8px;border-radius:10px;cursor:pointer;
    background:var(--panel2);border:1px solid var(--border);transition:.14s;
  }
  .maprow:hover{background:var(--panel3);border-color:var(--border2)}
  .maprow img{width:66px;height:66px;object-fit:cover;border-radius:7px;background:#0b1220;flex:none}
  .maprow .mi{flex:1;min-width:0}
  .maprow .mn{font-size:.84rem;color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .maprow .md{font-size:.68rem;color:var(--muted);margin-top:2px}
  .maprow .mdel{
    background:none;border:1px solid var(--border2);color:var(--muted);border-radius:7px;
    padding:5px 8px;cursor:pointer;font-size:.72rem;flex:none;
  }
  .maprow .mdel:hover{background:rgba(248,113,113,.14);border-color:rgba(248,113,113,.4);color:#fecaca}
  .badge{
    display:inline-block;font-size:.6rem;padding:2px 6px;border-radius:5px;margin-left:6px;
    background:rgba(74,222,128,.16);color:var(--green);border:1px solid rgba(74,222,128,.35);vertical-align:middle;
  }
  .empty{color:var(--muted);font-size:.78rem;text-align:center;padding:22px 0}

  /* ===== TABLET MÓD (szerkesztés) — behúzható Tár, touch-barát vezérlők =====
     Érintős / keskeny kijelzőn magától bekapcsol. A Tár (library) fiókká válik,
     hogy a vászon teljes szélességű legyen; a felső sáv görgethető. */
  #libToggle{ display:none; position:absolute; left:12px; bottom:12px; z-index:17;
    align-items:center; gap:7px; background:rgba(11,17,32,.94); color:var(--gold2);
    border:1px solid var(--gold); border-radius:12px; padding:11px 15px; font-size:.9rem;
    cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,.45); }
  #libBackdrop{ display:none; }
  .lib-close{ display:none; }
  @media (max-width: 860px), (pointer: coarse) {
    .topbar{ gap:7px; padding:0 10px; overflow-x:auto; overflow-y:hidden; }
    .topbar::-webkit-scrollbar{ height:0 }
    .topbar .tbtn{ flex:0 0 auto; padding:10px 12px; font-size:.82rem }
    .brand{ font-size:.9rem; flex:0 0 auto }
    .brand .pip, .admin-badge{ display:none }
    .count{ display:none }
    .toolrail{ width:66px; gap:8px }
    .tool{ width:50px; height:50px; font-size:22px }
    .tool .lbl{ display:none }
    .workspace{ position:relative }
    .library{
      position:absolute; top:0; bottom:0; left:66px; width:min(340px,84vw);
      transform:translateX(-118%); transition:transform .22s ease; z-index:16;
      box-shadow:14px 0 44px rgba(0,0,0,.55);
    }
    .library.open{ transform:translateX(0) }
    .lib-close{ display:inline-flex; align-items:center; justify-content:center; }
    #libBackdrop{ display:block; position:absolute; inset:0 0 0 66px; z-index:15;
      background:rgba(2,6,18,.5); opacity:0; pointer-events:none; transition:opacity .22s; }
    #libBackdrop.on{ opacity:1; pointer-events:auto; }
    #libToggle{ display:inline-flex }
    .swgrid{ grid-template-columns:repeat(4,1fr) }
    .hint{ display:none }
  }

  /* ===== VETÍTŐ MÓD (cast) — csak a battlemap + vissza gomb ===== */
  #castBack{ display:none; position:fixed; top:14px; left:14px; z-index:100000;
    align-items:center; gap:6px; background:rgba(10,14,26,.82); color:#e5e7eb;
    border:1px solid var(--border2); border-radius:10px; padding:9px 14px;
    font-size:.9rem; cursor:pointer; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  #castBack:hover{ background:rgba(20,26,43,.95); }
  body.cast-mode .topbar,
  body.cast-mode .toolrail,
  body.cast-mode .library,
  body.cast-mode .zoombar,
  body.cast-mode .hint{ display:none !important; }
  body.cast-mode #castBack{ display:inline-flex; }
  body.cast-mode{ overflow:hidden; overscroll-behavior:none; }
  /* A böngésző ne kapja el a touch-gesztusokat (pan/pinch) — a valódi Konva
     canvasra KELL tenni, mert a touch-action nem öröklődik. Globálisan, hogy
     tableten szerkesztéskor és vetítéskor is a Konva kapja meg az érintést. */
  .stage-wrap, #canvas, #canvas .konvajs-content, #canvas canvas { touch-action: none; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">⚔️ Ynev Battlemap <span class="pip">POC</span> <span class="admin-badge">Admin</span></div>
  <div class="topsep"></div>
  <button class="tbtn" onclick="openSaveDlg()">💾 Mentés</button>
  <button class="tbtn" onclick="openLoadDlg()">📂 Betöltés</button>
  <button class="tbtn" onclick="exportSceneJson()" title="Jelenet mentése JSON-fájlba">⬇ JSON</button>
  <button class="tbtn" onclick="document.getElementById('importJsonInput').click()" title="Jelenet betöltése JSON-fájlból">⬆ JSON</button>
  <input type="file" id="importJsonInput" accept=".json" style="display:none" onchange="importSceneJson(event)">
  <button class="tbtn danger" onclick="clearScene()">🗑 Ürítés</button>
  <button class="tbtn" onclick="location.href='km_pult'">↩ KM Pult</button>
  <div class="spacer"></div>
  <button class="tbtn on" id="gridBtn">▦ Rács</button>
  <button class="tbtn" onclick="resetView()">🎯 Középre</button>
  <span class="count" id="countTag">0 elem</span>
</div>

<div class="workspace">
  <div class="toolrail" id="toolrail"></div>
  <div class="library" id="library"></div>
  <div id="libBackdrop" onclick="toggleLibrary(false)"></div>
  <div class="stage-wrap">
    <div id="canvas"></div>
    <button id="libToggle" onclick="toggleLibrary()" title="Eszköztár / elemek">📚 Tár</button>
    <div class="hint" id="hint"></div>
    <div class="zoombar">
      <button class="tbtn" onclick="zoomBy(1.2)">＋</button>
      <button class="tbtn" onclick="zoomBy(1/1.2)">－</button>
    </div>
    <div class="toast" id="toast"></div>
  </div>
</div>

<button id="castBack" onclick="exitCast()" title="Kilépés a vetítésből">↩ Vissza</button>

<!-- Mentés névvel -->
<div class="mask" id="saveMask">
  <div class="dlg">
    <div class="dlg-head">
      <div class="dlg-title">Battlemap mentése</div>
      <div class="dlg-sub" id="saveSub">Adj nevet a térképnek — ezzel fogod megtalálni a KM Pultban.</div>
    </div>
    <div class="dlg-body">
      <label for="mapNameInput">Térkép neve</label>
      <input type="text" id="mapNameInput" maxlength="80" placeholder="pl. Elátkozott bánya — 2. szint" autocomplete="off">
      <label style="display:flex;flex-direction:row;align-items:center;gap:8px;margin-top:13px;cursor:pointer;color:var(--text);font-size:.78rem">
        <input type="checkbox" id="mapPublished"> Közzététel (a játékosok is látják)
      </label>
    </div>
    <div class="dlg-foot">
      <button class="tbtn" onclick="closeDlg('saveMask')">Mégse</button>
      <button class="tbtn on" id="saveConfirmBtn" onclick="confirmSave()">💾 Mentés</button>
    </div>
  </div>
</div>

<!-- Mentett térképek listája -->
<div class="mask" id="loadMask">
  <div class="dlg">
    <div class="dlg-head">
      <div class="dlg-title">Mentett battlemapek</div>
      <div class="dlg-sub">Kattints egy térképre a betöltéshez.</div>
    </div>
    <div class="dlg-body"><div class="maplist" id="mapList"><div class="empty">Betöltés…</div></div></div>
    <div class="dlg-foot"><button class="tbtn" onclick="closeDlg('loadMask')">Bezár</button></div>
  </div>
</div>

<script>
/* =========================================================
   TEXTÚRÁK
========================================================= */
const dataURI = s => `data:image/svg+xml,${encodeURIComponent(s)}`;
const tex = inner => dataURI(`<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">${inner}</svg>`);
const TEXTURES = {
  grass_flowers: { label:'Fű (virágos)', src:'assets/terrain/grass_flowers.jpg', seamless:true },
  grass_meadow:  { label:'Fű (rét)',     src:'assets/terrain/grass_meadow.jpg', seamless:true },
  grass_dark:    { label:'Fű (sötét)',   src:'assets/terrain/grass_dark.jpg', seamless:true },
  grass_clover:  { label:'Fű (lóhere)',  src:'assets/terrain/grass_clover.jpg', seamless:true },
  wood_light:  { label:'Fa padló (világos)', src:'assets/terrain/wood_light.jpg' },
  wood_dark:   { label:'Fa padló (sötét)',   src:'assets/terrain/wood_dark.jpg' },
  wood_walnut: { label:'Fa padló (dió)',     src:'assets/terrain/wood_walnut.jpg' },
  wood_ashen:  { label:'Fa padló (hamuszín)',src:'assets/terrain/wood_ashen.jpg' },
  water_ripple:  { label:'Víz (fodros)',   src:'assets/terrain/water_ripple.jpg' },
  water_ripple2: { label:'Víz (hullámos)', src:'assets/terrain/water_ripple2.jpg' },
  water_murky:   { label:'Víz (mély)',     src:'assets/terrain/water_murky.jpg' },
  stone: { label:'Kő', src: tex(`<rect width="128" height="128" fill="#5b636e"/>${[[6,6,54,40],[64,4,60,50],[4,50,46,44],[54,58,40,38],[98,58,26,40],[6,98,52,26],[62,100,60,24]].map(([x,y,w,h])=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="#6c757f" stroke="#454c55" stroke-width="2"/>`).join('')}`) },
  road: { label:'Kőút', src: tex(`<rect width="128" height="128" fill="#8b8579"/>${Array.from({length:22},()=>{const x=Math.random()*120,y=Math.random()*120,w=10+Math.random()*22,h=10+Math.random()*18;return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="hsl(40,10%,${52+Math.random()*14}%)" stroke="#6f6a5f" stroke-width="1.5"/>`}).join('')}`) },
  dirt: { label:'Föld', src: tex(`<rect width="128" height="128" fill="#7a5636"/>${Array.from({length:80},()=>{const x=Math.random()*128,y=Math.random()*128,r=1+Math.random()*3;return `<circle cx="${x}" cy="${y}" r="${r}" fill="hsl(30,35%,${28+Math.random()*22}%)" opacity="0.6"/>`}).join('')}`) },
  dirt_dark:   { label:'Föld (sötét)', src:'assets/terrain/dirt_dark.jpg' },

/* =========================================================
   PROCEDURÁLIS TEXTÚRA-GENERÁTOR (csempézhető raszter, seamless)
   Felülírja a fenti egyszerű SVG-textúrákat sokkal organikusabbal:
   fraktál-zaj (fbm) + Worley-cellák (kő/kőút) + erezet (fa) + fodrok (víz).
========================================================= */
const TS=256;
function _h(x,y,s){ let h=Math.imul(((x|0)*374761393) ^ ((y|0)*668265263) ^ ((s|0)*2246822519), 2654435761); h^=h>>>15; return ((h>>>0)%1000000)/1000000; }
function _sm(t){ return t*t*(3-2*t); }
function _lat(ix,iy,c,s){ ix=((ix%c)+c)%c; iy=((iy%c)+c)%c; return _h(ix,iy,s); }
function _vn(fx,fy,c,s){ const x0=Math.floor(fx),y0=Math.floor(fy),tx=_sm(fx-x0),ty=_sm(fy-y0);
  const a=_lat(x0,y0,c,s),b=_lat(x0+1,y0,c,s),d1=_lat(x0,y0+1,c,s),e=_lat(x0+1,y0+1,c,s);
  return (a*(1-tx)+b*tx)*(1-ty)+(d1*(1-tx)+e*tx)*ty; }
function _fbm(u,v,c,oct,s){ let amp=1,sum=0,tot=0,cc=c; for(let o=0;o<oct;o++){ sum+=amp*_vn(u*cc,v*cc,cc,s+o*13); tot+=amp; amp*=0.5; cc*=2; } return sum/tot; }
function _wor(u,v,c,s){ const gx=Math.floor(u*c),gy=Math.floor(v*c); let f1=9,f2=9,id=0,nx=0,ny=0;
  for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){ const ci=gx+ox,cj=gy+oy, rx=((ci%c)+c)%c, ry=((cj%c)+c)%c;
    const px=(ci+_h(rx,ry,s))/c, py=(cj+_h(rx,ry,s+71))/c; let dx=px-u,dy=py-v; dx-=Math.round(dx); dy-=Math.round(dy);
    const dd=Math.hypot(dx,dy); if(dd<f1){f2=f1;f1=dd;id=rx*197+ry;nx=-dx;ny=-dy;} else if(dd<f2)f2=dd; }
  return {f1,f2,id,nx,ny}; } // nx,ny = a legközelebbi cellaközéptől a pixel felé (megvilágításhoz)
function _hsl(h,s,l){ l=Math.max(0,Math.min(100,l))/100; s=Math.max(0,Math.min(100,s))/100; h=((h%360)+360)%360;
  const a=s*Math.min(l,1-l), f=n=>{ const k=(n+h/30)%12; return l-a*Math.max(-1,Math.min(k-3,Math.min(9-k,1))); };
  return [255*f(0),255*f(8),255*f(4)]; }
function _genTex(key){
  const cv=document.createElement('canvas'); cv.width=cv.height=TS; const ctx=cv.getContext('2d');
  const img=ctx.createImageData(TS,TS), D=img.data;

/* =========================================================
   VARRATMENTESÍTÉS ("PS Offset + heal" trükk)
   A négy negyedet felcseréljük (a kép szélei a közepére kerülnek) — ettől
   a canvas KÜLSŐ pereme magától varratmentessé válik (moduláris wraparound:
   a jobb szél mindig az eredeti bal szél folytatása marad). A régi szélek
   most egy "+" alakú varratként futnak a KÖZÉPEN — ezt egy szűk sávra
   korlátozott, lágy elmosással elkenjük. Az eredmény ugyanaz a fotó, de
   'repeat' mintaként festve nem látszanak rajta rácsvonalak.
========================================================= */
function makeSeamless(img){
  const w=img.width, h=img.height, hw=w/2, hh=h/2;
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const cx=cv.getContext('2d');
  cx.drawImage(img, hw,hh,hw,hh, 0,0,hw,hh);
  cx.drawImage(img, 0,hh,hw,hh, hw,0,hw,hh);
  cx.drawImage(img, hw,0,hw,hh, 0,hh,hw,hh);
  cx.drawImage(img, 0,0,hw,hh, hw,hh,hw,hh);
  const band=Math.round(w*0.03);
  const mask=document.createElement('canvas'); mask.width=w; mask.height=h; const mx=mask.getContext('2d');
  const gV=mx.createLinearGradient(hw-band,0,hw+band,0); gV.addColorStop(0,'rgba(255,255,255,0)'); gV.addColorStop(0.5,'rgba(255,255,255,1)'); gV.addColorStop(1,'rgba(255,255,255,0)');
  mx.fillStyle=gV; mx.fillRect(hw-band,0,band*2,h);
  const gH=mx.createLinearGradient(0,hh-band,0,hh+band); gH.addColorStop(0,'rgba(255,255,255,0)'); gH.addColorStop(0.5,'rgba(255,255,255,1)'); gH.addColorStop(1,'rgba(255,255,255,0)');
  mx.globalCompositeOperation='lighter'; mx.fillStyle=gH; mx.fillRect(0,hh-band,w,band*2);
  const blurred=document.createElement('canvas'); blurred.width=w; blurred.height=h; const bx=blurred.getContext('2d');
  bx.filter=`blur(${Math.round(w*0.03)}px)`; bx.drawImage(cv,0,0);
  bx.globalCompositeOperation='destination-in'; bx.filter='none'; bx.drawImage(mask,0,0);
  cx.drawImage(blurred,0,0);
  return cv;
}

// Ajtó: fa, kilinccsel, nyitható/csukható — a HINGE (zsanér) a bal szélen van (offsetX kicsi), így a
// forgatás valódi ajtó-lengésként hat, nem a kép közepén pörög. isOpen=true -> -90°-kal elfordul a
// zárt (fallal egy vonalban álló) alaphelyzethez (baseRotation) képest. Lerakáskor/húzás végén
// AUTOMATIKUSAN a legközelebbi falhoz igazodik (tetszőleges szögben, nem csak 90°-onként) és
// a fal ott KETTÉVÁLIK — a rés helyén nincs többé fal-textúra (ld. snapDoorToWall/cutWallForDoor).
const DOOR_HINGE_OFFSET = 14;
function makeDoor(key,x,y,opt={}){
  const def=ASSETS[key], base=opt.rotation||0;
  const node=new Konva.Image({ image:assetImg(key), width:def.w, height:def.h, x, y, offsetX:DOOR_HINGE_OFFSET, offsetY:def.h/2,
    draggable:(mode==='select'), rotation:base, scaleX:opt.scaleX||1, scaleY:opt.scaleY||1 });
  node.setAttr('kind','door'); node.setAttr('assetKey',key); node.setAttr('baseRotation',base); node.setAttr('isOpen',!!opt.isOpen);
  if(opt.isOpen) node.rotation(base-90);
  attachSelectable(node);
  node.on('dragend', ()=>{ snapDoorToWall(node); });
  mainLayer.add(node); tr.moveToTop();

}

  node.rotation(node.getAttr('baseRotation') + (open?-90:0)); node.getLayer().batchDraw(); renderLibrary(); }

/* --- Ajtó ↔ fal illesztés: tetszőleges szögű snap + a fal kivágása a rés helyén --- */
function wallGeom(w){
  const rad=w.rotation()*Math.PI/180, len=w.width(), x0=w.x(), y0=w.y();
  return { x0,y0, x1:x0+len*Math.cos(rad), y1:y0+len*Math.sin(rad), rad, len, thick:w.getAttr('thick'), mat:w.getAttr('mat') };
}
function closestPointOnSegment(px,py,x0,y0,x1,y1){
  const dx=x1-x0, dy=y1-y0, len2=dx*dx+dy*dy;
  let t = len2>0 ? ((px-x0)*dx+(py-y0)*dy)/len2 : 0; t=Math.max(0,Math.min(1,t));
  return { x:x0+t*dx, y:y0+t*dy };
}
const DOOR_SNAP_RANGE = 36;
function findWallForDoor(px,py){
  let best=null, bestDist=DOOR_SNAP_RANGE;
  mainLayer.getChildren(n=>n.getAttr('kind')==='wall').forEach(w=>{
    const g=wallGeom(w), cp=closestPointOnSegment(px,py,g.x0,g.y0,g.x1,g.y1), d=Math.hypot(px-cp.x,py-cp.y);
    if(d<bestDist){ bestDist=d; best={wall:w,geom:g,point:cp}; }
  });
  return best;
}
function snapDoorToWall(doorNode){
  const def=ASSETS[doorNode.getAttr('assetKey')], scale=doorNode.scaleX()||1;
  const halfLen=(def.w/2)*scale, hingeOffset=(def.w/2-DOOR_HINGE_OFFSET)*scale;
  // A keresés a zsanér-pontból indul (a doorNode x/y-ja pont ez) — egyszerűbb és megbízhatóbb, mint
  // a még-nem-ismert fal-irány alapján becsült középpontból indulni (az korábban hibásan messze
  // eshetett egy ferde falnál, mert a becslés a RÉGI/0 elforgatást használta).
  const found=findWallForDoor(doorNode.x(),doorNode.y());
  if(!found) return false;
  const {wall,geom,point}=found, rotDeg=geom.rad*180/Math.PI;
  doorNode.position({ x:point.x-hingeOffset*Math.cos(geom.rad), y:point.y-hingeOffset*Math.sin(geom.rad) });
  doorNode.setAttr('baseRotation',rotDeg);
  doorNode.rotation(doorNode.getAttr('isOpen') ? rotDeg-90 : rotDeg);
  cutWallForDoor(wall,geom,point,halfLen*2);
  mainLayer.batchDraw(); updateCount();
  return true;
}
function cutWallForDoor(wall,geom,point,doorWidth){
  const half=doorWidth/2, distFromStart=Math.hypot(point.x-geom.x0,point.y-geom.y0);
  const gapStart=Math.max(0,distFromStart-half), gapEnd=Math.min(geom.len,distFromStart+half);
  const rotDeg=geom.rad*180/Math.PI;
  wall.destroy();
  if(gapStart>4) makeWallSegment(geom.x0,geom.y0,gapStart,rotDeg,geom.mat,{thick:geom.thick});
  if(geom.len-gapEnd>4){ const sx=geom.x0+gapEnd*Math.cos(geom.rad), sy=geom.y0+gapEnd*Math.sin(geom.rad);
    makeWallSegment(sx,sy,geom.len-gapEnd,rotDeg,geom.mat,{thick:geom.thick}); }
}
