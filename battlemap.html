function paintStamp(x,y,texKey,size){
  const r=size/2, d=Math.min(size,SBUF);
  sctx.clearRect(0,0,SBUF,SBUF);
  sctx.save(); sctx.translate(r-x, r-y);
  sctx.fillStyle = sctx.createPattern(texImg(texKey),'repeat'); sctx.fillRect(x-r, y-r, d, d); sctx.restore();
  sctx.globalCompositeOperation='destination-in';
  const g=sctx.createRadialGradient(r,r,r*0.25, r,r,r);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.7,'rgba(255,255,255,0.92)'); g.addColorStop(1,'rgba(255,255,255,0)');
  sctx.fillStyle=g; sctx.fillRect(0,0,d,d); sctx.globalCompositeOperation='source-over';
  tctx.drawImage(sbuf, 0,0,d,d, x-r,y-r,d,d);
}
function eraseStamp(x,y,size){
  const r=size/2; tctx.save(); tctx.globalCompositeOperation='destination-out';
  const g=tctx.createRadialGradient(x,y,r*0.2, x,y,r); g.addColorStop(0,'rgba(0,0,0,1)'); g.addColorStop(1,'rgba(0,0,0,0)');
  tctx.fillStyle=g; tctx.beginPath(); tctx.arc(x,y,r,0,Math.PI*2); tctx.fill(); tctx.restore();
}
function paintRegion(drawPath, bb, texKey, sharp){
  const pad=sharp?2:28, w=Math.ceil(bb.w+pad*2), h=Math.ceil(bb.h+pad*2);
  const mc=document.createElement('canvas'); mc.width=w; mc.height=h; const m=mc.getContext('2d');
  m.save(); m.translate(pad-bb.x, pad-bb.y); if(!sharp) m.filter='blur(10px)'; m.fillStyle='#fff'; m.beginPath(); drawPath(m); m.fill(); m.restore();
  const tc=document.createElement('canvas'); tc.width=w; tc.height=h; const t=tc.getContext('2d');
  t.save(); t.translate(pad-bb.x, pad-bb.y); t.fillStyle=t.createPattern(texImg(texKey),'repeat'); t.fillRect(bb.x-pad, bb.y-pad, w, h); t.restore();
  t.globalCompositeOperation='destination-in'; t.drawImage(mc,0,0);
  tctx.drawImage(tc, bb.x-pad, bb.y-pad); terrDraw();
}

/* =========================================================
   KONTEXTUS-ÉRZÉKENY SZÉLEK — v3 (elmosott maszkok, KÜLÖN réteg)
   Finom (24 világ-egység/cella) rács tárolja, PONTOSAN melyik textúra-
   variáns fedi legutóbb az adott cellát (kör/sokszög szerint jelölve,
   nem bbox-szal). Festés/törlés/kitöltés után a dirty sávban:
   1) minden jelenlévő (nem fa) KATEGÓRIÁRA felépítünk egy kis, cella-
      felbontású fekete/fehér maszkot, majd nagyítva+elmosva ("blur")
      egy FOLYTONOS, síma, a rács-cellák szögletességétől független
      "közelség-felhőt" kapunk (nincs lépcsőzetes/szögletes műtermék,
      mert a maszk bilineárisan interpolált, nem cellánkénti téglalap).
   2) minden (A,B) szomszédos kategória-párra B "hatását" (jellemző
      színe, blend-mód, elmosási sugár — ld. MAT_INFLUENCE, mindegyik
      anyagnak saját "személyisége" van) ráUsztjuk A területére, a
      B-hez való közelséggel arányos, sima erősséggel.
   3) a szemcsés anyagoknál (kő/út/föld/homok) pár apró, ritkás morzsa
      is átkerül a határ mentén (kő=vaskosabb kavics, homok=finom
      szemcse, stb. — anyagonként más méret/sűrűség).
   FONTOS: ez egy KÜLÖN, a talaj fölötti "blend" canvas/réteg (bctx),
   NEM a talaj-raszterbe sütve! Ezért minden újraszámoláskor előbb
   TÖRÖLJÜK az érintett sávot, és a JELENLEGI rács-állapotból építjük
   újra — így a hatás SOSEM halmozódik (ez okozta a korábbi verzió
   "opacity bug"-ját: egymást átfedő festések után egyes sávok többször
   kaptak tintet, ezért lettek szembeötlően sötétebb/élesebb foltok).
   MEGJEGYZÉS: a rács NEM kerül mentésre — mentéskor belesimítjuk a
   blend-réteget a talaj-PNG-be (ld. serialize()).
========================================================= */
const EDGE_CELL=24, EDGE_GRIDN=Math.ceil(WORLD/EDGE_CELL);
const typeGrid = new Uint8Array(EDGE_GRIDN*EDGE_GRIDN);
const blend = document.createElement('canvas'); blend.width=WORLD; blend.height=WORLD;
const bctx = blend.getContext('2d');
const blendNode = new Konva.Image({ image:blend, x:0, y:0, width:WORLD, height:WORLD, listening:false });
terrainLayer.add(blendNode);
const CAT_LIST = ['grass','wood','water','stone','road','dirt','sand','brick'];
const TEX_KEY_LIST = Object.keys(TEXTURES);
function categoryOf(texKey){ if(!texKey) return 0; const i=CAT_LIST.indexOf(texKey.split('_')[0]); return i<0?0:i+1; }
function texIndexOf(texKey){ const i=TEX_KEY_LIST.indexOf(texKey); return i<0?0:i+1; }
function gridIdx(gx,gy){ return gy*EDGE_GRIDN+gx; }
// Cella-KÖZÉPPONT teszttel jelöl (nem "minden cella, amit a bbox érint") — enélkül két,
// pontosan egymáshoz illesztett téglalap (pl. fű vége = víz eleje ugyanazon a koordinátán)
// UGYANAZT a határ-menti rács-sort próbálta igényelni, a később festett felülírta -> a
// szomszédos anyag hatásköre egy teljes cellányit (24px) rossz helyre tolódott.
function markGridRect(x0,y0,x1,y1,idx){
  const gx0=Math.max(0,Math.floor(x0/EDGE_CELL)), gx1=Math.min(EDGE_GRIDN-1,Math.floor(x1/EDGE_CELL));
  const gy0=Math.max(0,Math.floor(y0/EDGE_CELL)), gy1=Math.min(EDGE_GRIDN-1,Math.floor(y1/EDGE_CELL));
  for(let gy=gy0; gy<=gy1; gy++) for(let gx=gx0; gx<=gx1; gx++){
    const cx=(gx+0.5)*EDGE_CELL, cy=(gy+0.5)*EDGE_CELL;
    if(cx>=x0 && cx<x1 && cy>=y0 && cy<y1) typeGrid[gridIdx(gx,gy)]=idx;
  }
}
// Szabálytalan folt (poligon) esetén NEM a bbox-ot jelöljük — csak azokat a cellákat, amiknek a
// középpontja ténylegesen a sokszögön belül esik. Enélkül a bbox sarkai (ahol valójában nincs
// festés) hamis anyaghatárként jelentek meg -> szögletes "tömb" műtermékek a kerek/szerves folt szélén.
function markGridPoly(pts,idx){
  const xs=pts.filter((_,i)=>i%2===0), ys=pts.filter((_,i)=>i%2===1);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const gx0=Math.max(0,Math.floor(x0/EDGE_CELL)), gx1=Math.min(EDGE_GRIDN-1,Math.floor(x1/EDGE_CELL));
  const gy0=Math.max(0,Math.floor(y0/EDGE_CELL)), gy1=Math.min(EDGE_GRIDN-1,Math.floor(y1/EDGE_CELL));
  for(let gy=gy0; gy<=gy1; gy++) for(let gx=gx0; gx<=gx1; gx++){
    const px=(gx+0.5)*EDGE_CELL, py=(gy+0.5)*EDGE_CELL; let inside=false;
    for(let i=0,j=pts.length-2;i<pts.length;j=i,i+=2){ const xi=pts[i],yi=pts[i+1],xj=pts[j],yj=pts[j+1];
      if(((yi>py)!==(yj>py)) && (px < (xj-xi)*(py-yi)/(yj-yi)+xi)) inside=!inside; }
    if(inside) typeGrid[gridIdx(gx,gy)]=idx;
  }
}
// Valódi kör szerint jelöli a rácsot (nem a bbox-szal) — enélkül a kerek stampek sarkai
// tévesen "anyagosnak" tűntek a rácsban, ez okozta a szögletes él-műtermékeket.
function markGridCircle(cx,cy,r,idx){
  const gx0=Math.max(0,Math.floor((cx-r)/EDGE_CELL)), gx1=Math.min(EDGE_GRIDN-1,Math.floor((cx+r)/EDGE_CELL));
  const gy0=Math.max(0,Math.floor((cy-r)/EDGE_CELL)), gy1=Math.min(EDGE_GRIDN-1,Math.floor((cy+r)/EDGE_CELL));
  const r2=(r*0.72)*(r*0.72); // kicsit a sugáron belülre húzzuk, hogy a fedett cella tényleg jórészt festett legyen
  for(let gy=gy0; gy<=gy1; gy++) for(let gx=gx0; gx<=gx1; gx++){
    const ccx=(gx+0.5)*EDGE_CELL, ccy=(gy+0.5)*EDGE_CELL, dx=ccx-cx, dy=ccy-cy;
    if(dx*dx+dy*dy<=r2) typeGrid[gridIdx(gx,gy)]=idx;
  }
}
function sideRect(gx,gy,dir,side,thick){ const c=EDGE_CELL, t=thick;
  if(dir==='r'){ const bx=(gx+1)*c, by=gy*c;
    return side==='A' ? {x:bx-t,y:by,w:t,h:c} : {x:bx,y:by,w:t,h:c}; }
  const bx=gx*c, by=(gy+1)*c;
  return side==='A' ? {x:bx,y:by-t,w:c,h:t} : {x:bx,y:by,w:c,h:t};
}
function grainSide(r,grain,count){ for(let i=0;i<count;i++){ const x=r.x+Math.random()*r.w, y=r.y+Math.random()*r.h;
  const rad=grain.r[0]+Math.random()*(grain.r[1]-grain.r[0]);
  bctx.beginPath(); bctx.arc(x,y,rad,0,Math.PI*2); bctx.fillStyle=`rgba(${grain.c},${0.45+Math.random()*0.35})`; bctx.fill(); } }
// Minden anyagnak SAJÁT "személyisége": jellemző színe, ahogy ez a szín rákeveredik a
// szomszédra (blend-mód — a víz pl. sötétít/multiply, a homok világosít/screen, mintha
// porként szóródna), meddig ér el az elmosott hatása (blur), és milyen "morzsát" hagy hátra
// (csak a ténylegesen szemcsés anyagoknál — a víz és a fű nem szór darabkát).
const MAT_INFLUENCE = {
  grass: { color:'18,42,20',   mode:'multiply',    alpha:0.32, blur:15, grain:null },
  water: { color:'4,14,18',    mode:'multiply',    alpha:0.78, blur:30, grain:null }, // messzire elmosódó, MÉLY sötétedés — "vizesedés" (user kérésére erősítve: fű+homok is jobban sötétedjen mellette)
  stone: { color:'150,150,144',mode:'source-over', alpha:0.26, blur:13, grain:{c:'146,146,140', r:[1.1,2.6]} }, // vaskosabb kavics
  road:  { color:'150,140,112',mode:'source-over', alpha:0.24, blur:14, grain:{c:'160,150,120', r:[0.9,2]} },
  dirt:  { color:'92,66,42',   mode:'multiply',    alpha:0.3,  blur:14, grain:{c:'112,82,52', r:[1,2.2]} }, // "foltosít", sötétebbre old
  sand:  { color:'232,214,164',mode:'screen',      alpha:0.5,  blur:20, grain:{c:'236,220,172', r:[0.5,1.2]} }, // finom, világosító por
  brick: { color:'140,84,66',  mode:'source-over', alpha:0.2,  blur:11, grain:{c:'150,90,70', r:[0.9,1.8]} }, // épített anyag: rövid hatótáv
};
// Kis, cella-felbontású fekete/fehér maszkot épít egy kategóriára a megadott rács-tartományban,
// majd világ-pixelre nagyítva ELMOSSA (bilineáris nagyítás + CSS blur) — ez adja a folytonos,
// sima "közelség-felhőt", aminek NINCS köze a 24px-es rács szögletességéhez.
function worldMaskFor(cat,gx0,gy0,gx1,gy1,blurPx){
  const cw=gx1-gx0+1, ch=gy1-gy0+1;
  const small=document.createElement('canvas'); small.width=cw; small.height=ch;
  const sc=small.getContext('2d'); const id=sc.createImageData(cw,ch); let any=false;
  for(let gy=gy0; gy<=gy1; gy++) for(let gx=gx0; gx<=gx1; gx++){
    const idx=typeGrid[gridIdx(gx,gy)]; const c=idx?CAT_LIST[categoryOf(TEX_KEY_LIST[idx-1])-1]:null;
    const on=c===cat; if(on) any=true;
    const p=((gy-gy0)*cw+(gx-gx0))*4; id.data[p]=255;id.data[p+1]=255;id.data[p+2]=255;id.data[p+3]=on?255:0;
  }
  if(!any) return null;
  sc.putImageData(id,0,0);
  const wpx=cw*EDGE_CELL, hpx=ch*EDGE_CELL;
  const big=document.createElement('canvas'); big.width=wpx; big.height=hpx;
  const bc=big.getContext('2d'); bc.imageSmoothingEnabled=true; if(blurPx) bc.filter=`blur(${blurPx}px)`;
  bc.drawImage(small,0,0,wpx,hpx);
  return {canvas:big, x:gx0*EDGE_CELL, y:gy0*EDGE_CELL, w:wpx, h:hpx};
}
// srcCat "hatását" (jellemző színét, elmosva a hozzá való közelséggel arányosan) ráfesti
// dstCat TÉNYLEGES (nem elmosott) területére — a bctx blend-rétegre, nem a talajra.
function compositeInfluence(srcCat,dstCat,getBlurred,getHard){
  const inf=MAT_INFLUENCE[srcCat]; if(!inf) return;
  const srcMask=getBlurred(srcCat); if(!srcMask) return;
  const dstMask=getHard(dstCat); if(!dstMask) return;
  const tmp=document.createElement('canvas'); tmp.width=srcMask.w; tmp.height=srcMask.h;
  const tc=tmp.getContext('2d');
  tc.fillStyle=`rgb(${inf.color})`; tc.fillRect(0,0,tmp.width,tmp.height);
  tc.globalCompositeOperation='destination-in'; tc.drawImage(srcMask.canvas,0,0);
  tc.globalCompositeOperation='destination-in'; tc.drawImage(dstMask.canvas,0,0);
  bctx.save(); bctx.globalAlpha=inf.alpha; bctx.globalCompositeOperation=inf.mode;
  bctx.drawImage(tmp, srcMask.x, srcMask.y); bctx.restore();
}
// Ugyanaz a maszk-technika, de EGY KATEGÓRIÁN BELÜLI variáns-váltásra (pl. két fűfajta határa):
// itt nem egy jellemző SZÍNT, hanem magát a MÁSIK VARIÁNS FOTÓ-TEXTÚRÁJÁT "oldjuk fel" lágyan
// a szomszéd területére — így a két fű-fotó valóban egymásba mosódik, nem éles vágás van köztük.
function worldMaskForKey(texKey,gx0,gy0,gx1,gy1,blurPx){
  const idx=texIndexOf(texKey), cw=gx1-gx0+1, ch=gy1-gy0+1;
  const small=document.createElement('canvas'); small.width=cw; small.height=ch;
  const sc=small.getContext('2d'); const id=sc.createImageData(cw,ch); let any=false;
  for(let gy=gy0; gy<=gy1; gy++) for(let gx=gx0; gx<=gx1; gx++){
    const on=typeGrid[gridIdx(gx,gy)]===idx; if(on) any=true;
    const p=((gy-gy0)*cw+(gx-gx0))*4; id.data[p]=255;id.data[p+1]=255;id.data[p+2]=255;id.data[p+3]=on?255:0;
  }
  if(!any) return null;
  sc.putImageData(id,0,0);
  const wpx=cw*EDGE_CELL, hpx=ch*EDGE_CELL;
  const big=document.createElement('canvas'); big.width=wpx; big.height=hpx;
  const bc=big.getContext('2d'); bc.imageSmoothingEnabled=true; if(blurPx) bc.filter=`blur(${blurPx}px)`;
  bc.drawImage(small,0,0,wpx,hpx);
  return {canvas:big, x:gx0*EDGE_CELL, y:gy0*EDGE_CELL, w:wpx, h:hpx};
}
const VARIANT_BLUR=18, VARIANT_ALPHA=0.55;
function compositeVariantDissolve(srcKey,dstKey,getBlurredKey,getHardKey){
  const srcMask=getBlurredKey(srcKey); if(!srcMask) return;
  const dstMask=getHardKey(dstKey); if(!dstMask) return;
  const tmp=document.createElement('canvas'); tmp.width=srcMask.w; tmp.height=srcMask.h;
  const tc=tmp.getContext('2d');
  tc.fillStyle=tc.createPattern(texImg(srcKey),'repeat'); tc.fillRect(0,0,tmp.width,tmp.height);
  tc.globalCompositeOperation='destination-in'; tc.drawImage(srcMask.canvas,0,0);
  tc.globalCompositeOperation='destination-in'; tc.drawImage(dstMask.canvas,0,0);
  bctx.save(); bctx.globalAlpha=VARIANT_ALPHA; bctx.globalCompositeOperation='source-over';
  bctx.drawImage(tmp, srcMask.x, srcMask.y); bctx.restore();
}
function applyEdgeBlends(x0,y0,x1,y1){
  const pad=3; // extra rács-margó, hogy a blur "beázhasson" a régió szélén is, ne vágódjon le élesen
  const gx0=Math.max(0,Math.floor(x0/EDGE_CELL)-pad), gx1=Math.min(EDGE_GRIDN-1,Math.floor(x1/EDGE_CELL)+pad);
  const gy0=Math.max(0,Math.floor(y0/EDGE_CELL)-pad), gy1=Math.min(EDGE_GRIDN-1,Math.floor(y1/EDGE_CELL)+pad);
  // Idempotencia: a blend-réteg CSAK a jelenlegi rács-állapotot tükrözi — előbb töröljük az
  // érintett sávot, aztán frissen építjük fel. Így SOSEM halmozódik (nincs "opacity bug").
  bctx.clearRect(gx0*EDGE_CELL, gy0*EDGE_CELL, (gx1-gx0+1)*EDGE_CELL, (gy1-gy0+1)*EDGE_CELL);
  const present=new Set();
  for(let gy=gy0; gy<=gy1; gy++) for(let gx=gx0; gx<=gx1; gx++){ const idx=typeGrid[gridIdx(gx,gy)]; if(!idx) continue;
    const c=CAT_LIST[categoryOf(TEX_KEY_LIST[idx-1])-1]; if(c!=='wood') present.add(c); }
  const cats=[...present];
  if(cats.length>1){
    const blurredCache={}, hardCache={};
    const getBlurred=c=> c in blurredCache ? blurredCache[c] : (blurredCache[c]=worldMaskFor(c,gx0,gy0,gx1,gy1,MAT_INFLUENCE[c].blur));
    const getHard   =c=> c in hardCache    ? hardCache[c]    : (hardCache[c]=worldMaskFor(c,gx0,gy0,gx1,gy1,0));
    for(let i=0;i<cats.length;i++) for(let j=0;j<cats.length;j++){ if(i!==j) compositeInfluence(cats[i],cats[j],getBlurred,getHard); }
  }
  // Szemcse (különböző ANYAGOK határán) + variáns-pár gyűjtés (ugyanazon anyagcsalád két
  // fotója közt, pl. két fűfajta) — cella-határonként, csak a ténylegesen szomszédos párokra.
  const variantPairs=new Set();
  for(let gy=gy0; gy<gy1; gy++) for(let gx=gx0; gx<gx1; gx++){
    const here=typeGrid[gridIdx(gx,gy)]; if(!here) continue; const hereCat=CAT_LIST[categoryOf(TEX_KEY_LIST[here-1])-1];
    if(hereCat==='wood') continue;
    if(gx+1<EDGE_GRIDN){ const there=typeGrid[gridIdx(gx+1,gy)]; if(there && there!==here){ const thereCat=CAT_LIST[categoryOf(TEX_KEY_LIST[there-1])-1];
      if(thereCat==='wood'){ /* fa padló kimarad */ }
      else if(thereCat===hereCat){ variantPairs.add(TEX_KEY_LIST[here-1]+'|'+TEX_KEY_LIST[there-1]); }
      else { const mH=MAT_INFLUENCE[hereCat], mT=MAT_INFLUENCE[thereCat];
        if(mT.grain) grainSide(sideRect(gx,gy,'r','A',13), mT.grain, 2);
        if(mH.grain) grainSide(sideRect(gx,gy,'r','B',13), mH.grain, 2); } } }
    if(gy+1<EDGE_GRIDN){ const there=typeGrid[gridIdx(gx,gy+1)]; if(there && there!==here){ const thereCat=CAT_LIST[categoryOf(TEX_KEY_LIST[there-1])-1];
      if(thereCat==='wood'){ /* fa padló kimarad */ }
      else if(thereCat===hereCat){ variantPairs.add(TEX_KEY_LIST[here-1]+'|'+TEX_KEY_LIST[there-1]); }
      else { const mH=MAT_INFLUENCE[hereCat], mT=MAT_INFLUENCE[thereCat];
        if(mT.grain) grainSide(sideRect(gx,gy,'b','A',13), mT.grain, 2);
        if(mH.grain) grainSide(sideRect(gx,gy,'b','B',13), mH.grain, 2); } } }
  }
  if(variantPairs.size){
    const vBlurredCache={}, vHardCache={};
    const getBlurredKey=k=> k in vBlurredCache ? vBlurredCache[k] : (vBlurredCache[k]=worldMaskForKey(k,gx0,gy0,gx1,gy1,VARIANT_BLUR));
    const getHardKey   =k=> k in vHardCache    ? vHardCache[k]    : (vHardCache[k]=worldMaskForKey(k,gx0,gy0,gx1,gy1,0));
    variantPairs.forEach(pair=>{ const [a,b]=pair.split('|');
      compositeVariantDissolve(a,b,getBlurredKey,getHardKey);
      compositeVariantDissolve(b,a,getBlurredKey,getHardKey); });
  }
  terrDraw();
}

let painting=false, rawBuf=[], lastPaint=null, paintBBox=null;
// Egy pont "lestampolása": radírnál eraseStamp(x,y,size), ecsetnél paintStamp(x,y,tex,size).
// (Korábban közös hívás volt, ami a radírnak a textúra-nevet adta méretként -> NaN sugár -> nem törölt.)
function stampAt(x,y){
  if(mode==='eraser'){ eraseStamp(x,y,brushSize); markGridCircle(x,y,brushSize/2,0); }
  else { paintStamp(x,y,currentTex,brushSize); markGridCircle(x,y,brushSize/2,texIndexOf(currentTex)); }
  const r=brushSize;
  paintBBox = paintBBox ? {x0:Math.min(paintBBox.x0,x-r),y0:Math.min(paintBBox.y0,y-r),x1:Math.max(paintBBox.x1,x+r),y1:Math.max(paintBBox.y1,y+r)} : {x0:x-r,y0:y-r,x1:x+r,y1:y+r};
}
function beginPaint(){ painting=true; rawBuf=[]; paintBBox=null; const p=worldPointer(); rawBuf.push(p); lastPaint=p; stampAt(p.x,p.y); terrDraw(); }
function movePaint(){ if(!painting)return; const p=worldPointer(); rawBuf.push(p); if(rawBuf.length>4)rawBuf.shift();
  const s={x:0,y:0}; rawBuf.forEach(q=>{s.x+=q.x;s.y+=q.y}); s.x/=rawBuf.length; s.y/=rawBuf.length;
  const d=Math.hypot(s.x-lastPaint.x,s.y-lastPaint.y), step=Math.max(2,brushSize*0.2), n=Math.floor(d/step);
  for(let i=1;i<=n;i++){ const t=i/n; stampAt(lastPaint.x+(s.x-lastPaint.x)*t, lastPaint.y+(s.y-lastPaint.y)*t); }
  if(n>0) lastPaint=s; terrDraw();
}
function endPaint(){ if(painting){ const p=worldPointer(); stampAt(p.x,p.y); terrDraw(); if(paintBBox) applyEdgeBlends(paintBBox.x0,paintBBox.y0,paintBBox.x1,paintBBox.y1); } painting=false; updateCount(); }

/* terület / folt / fal draftok */
let draftStart=null, draftRect=null, polyPts=[], polyPreview=null, wallPts=[], wallPreview=null, shiftDown=false;
let wallMat='brick', wallThick=18;
function refreshPolyPreview(extra){
  clearDrafts();
  const pts=[...polyPts]; if(extra)pts.push(extra.x,extra.y);
  polyPreview=new Konva.Line({points:pts, stroke:'#4ade80', strokeWidth:2, dash:[6,4], closed:polyPts.length>=4, fill:'#4ade8022'});
  overlay.add(polyPreview);
  for(let i=0;i<polyPts.length;i+=2){ overlay.add(new Konva.Circle({x:polyPts[i],y:polyPts[i+1],radius:5,fill:'#4ade80',stroke:'#0b1220',strokeWidth:1})); }
  overlay.batchDraw();
}
function finalizePoly(){ if(polyPts.length>=6){ const xs=polyPts.filter((_,i)=>i%2===0), ys=polyPts.filter((_,i)=>i%2===1);
    const bb={x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};
    paintRegion(m=>{ m.moveTo(polyPts[0],polyPts[1]); for(let i=2;i<polyPts.length;i+=2)m.lineTo(polyPts[i],polyPts[i+1]); m.closePath(); }, bb, currentTex, sharpEdge);
    markGridPoly(polyPts,texIndexOf(currentTex));
    applyEdgeBlends(bb.x-EDGE_CELL,bb.y-EDGE_CELL,bb.x+bb.w+EDGE_CELL,bb.y+bb.h+EDGE_CELL); }
  polyPts=[]; polyPreview=null; clearDrafts(); }
function snapP(p){ return { x:Math.round(p.x/CELL)*CELL, y:Math.round(p.y/CELL)*CELL }; }
function angleLock(from,to){ const dx=to.x-from.x, dy=to.y-from.y, len=Math.hypot(dx,dy); let a=Math.atan2(dy,dx); a=Math.round(a/(Math.PI/4))*(Math.PI/4); return {x:from.x+Math.cos(a)*len,y:from.y+Math.sin(a)*len}; }
function makeWallSegment(x,y,len,rotDeg,matKey,opt={}){
  const th=opt.thick||wallThick;
  const seg=new Konva.Rect({ x,y, width:len, height:th, offsetY:th/2, rotation:rotDeg, scaleX:opt.scaleX||1, scaleY:opt.scaleY||1,
    fillPatternImage:wallTexImg(matKey), fillPatternRepeat:'repeat', fillPatternScale:{x:1.4,y:1.4}, stroke:'#00000040', strokeWidth:1, draggable:(mode==='select') });
  seg.setAttr('kind','wall'); seg.setAttr('mat',matKey); seg.setAttr('thick',th);
  attachSelectable(seg); mainLayer.add(seg);
  seg.moveToBottom(); // a fal SOSE takarja el az elemeket (fa, bútor, stb.) — mindig a réteg aljára kerül
  tr.moveToTop(); return seg;
}
function refreshWallPreview(cur){ clearDrafts();
  const pts=wallPts.map(p=>({...p})); if(cur){ let c=cur; if(shiftDown&&pts.length)c=angleLock(pts[pts.length-1],cur); pts.push(c); }
  const flat=[]; pts.forEach(p=>flat.push(p.x,p.y)); wallPreview=new Konva.Line({points:flat,stroke:'#f0d488',strokeWidth:4,dash:[8,5]}); overlay.add(wallPreview);
  pts.forEach(p=> overlay.add(new Konva.Circle({x:p.x,y:p.y,radius:5,fill:'#f0d488',stroke:'#0b1220',strokeWidth:1}))); overlay.batchDraw(); }
// Oszlop (pillar) minden TÖRÉSPONTBA (2+ fal-szakasz találkozása) — ugyanazt a fal-textúrát
// használja mint a szakaszok, ezért anyag szerint automatikusan illeszkedik (fa/kő/tégla).
// Ez fedi el a törésnél a két ferde téglalap-vég csúnya, nem-illeszkedő varratát.
function makeWallPillar(x,y,thick,matKey){
  const size=thick*2.6;
  const p=new Konva.Rect({ x,y, width:size, height:size, offsetX:size/2, offsetY:size/2,
    fillPatternImage:wallTexImg(matKey), fillPatternRepeat:'repeat', fillPatternScale:{x:1.4,y:1.4}, stroke:'#00000050', strokeWidth:1, draggable:(mode==='select') });
  p.setAttr('kind','wall'); p.setAttr('mat',matKey); p.setAttr('thick',thick);
  attachSelectable(p); mainLayer.add(p); p.moveToBottom(); tr.moveToTop(); return p;
}
function finalizeWall(){
  for(let i=0;i<wallPts.length-1;i++){ const a=wallPts[i],b=wallPts[i+1],len=Math.hypot(b.x-a.x,b.y-a.y); if(len<2)continue;
    makeWallSegment(a.x,a.y,len,Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI,wallMat,{thick:wallThick}); }
  for(let i=1;i<wallPts.length-1;i++){ makeWallPillar(wallPts[i].x,wallPts[i].y,wallThick,wallMat); }
  wallPts=[]; if(wallPreview){wallPreview.destroy();wallPreview=null;} overlay.destroyChildren(); overlay.batchDraw(); mainLayer.batchDraw(); updateCount(); }

/* =========================================================
   STAGE ESEMÉNYEK
========================================================= */
let rotatingGhost=false, rotateStartAngle=0, rotateStartRot=0;
stage.on('mousedown touchstart', e=>{
  if(mode==='stamp' && ghost && e.evt && e.evt.button===1){ e.evt.preventDefault();
    const p=worldPointer(); rotatingGhost=true;
    rotateStartAngle=Math.atan2(p.y-ghost.y(), p.x-ghost.x())*180/Math.PI; rotateStartRot=stampRot; return; }
  if(mode==='brush'||mode==='eraser'){ beginPaint(); }
  else if(mode==='terrain-rect'){ draftStart=worldPointer();
    draftRect=new Konva.Rect({x:draftStart.x,y:draftStart.y,width:0,height:0,stroke:'#4ade80',strokeWidth:2,dash:[6,4],fill:'#4ade8022'}); overlay.add(draftRect); overlay.batchDraw(); }
});
stage.on('mousemove touchmove', ()=>{
  if(mode==='stamp'){
    if(rotatingGhost && ghost){ const p=worldPointer();
      const ang=Math.atan2(p.y-ghost.y(), p.x-ghost.x())*180/Math.PI;
      stampRot=((rotateStartRot+(ang-rotateStartAngle))%360+360)%360; }
    moveGhost(); return; }
  if(mode==='brush'||mode==='eraser') updateRing();
  if(painting){ movePaint(); }
  else if(mode==='terrain-rect' && draftRect){ const p=worldPointer();
    draftRect.position({x:Math.min(p.x,draftStart.x),y:Math.min(p.y,draftStart.y)}); draftRect.size({width:Math.abs(p.x-draftStart.x),height:Math.abs(p.y-draftStart.y)}); overlay.batchDraw(); }
  else if(mode==='terrain-poly' && polyPts.length){ refreshPolyPreview(worldPointer()); }
  else if(mode==='wall' && wallPts.length){ refreshWallPreview(worldPointer()); }
});
window.addEventListener('mouseup', e=>{ if(e.button===1) rotatingGhost=false; });
function finalizeRect(){ if(!draftRect)return; const x=draftRect.x(),y=draftRect.y(),w=draftRect.width(),h=draftRect.height();
  draftRect.destroy(); draftRect=null; overlay.batchDraw();
  if(w>8&&h>8){ paintRegion(m=>m.rect(x,y,w,h),{x,y,w,h},currentTex,sharpEdge);
    markGridRect(x,y,x+w,y+h,texIndexOf(currentTex));
    applyEdgeBlends(x-EDGE_CELL,y-EDGE_CELL,x+w+EDGE_CELL,y+h+EDGE_CELL); }
  updateCount(); }
stage.on('mouseup touchend', ()=>{ if(painting){ endPaint(); } else if(mode==='terrain-rect'){ finalizeRect(); } });
// Ha a vásznon KÍVÜL engeded fel az egeret, a stage nem kap 'mouseup'-ot -> a
// draft-téglalap / festés bennragadna. Globális felengedés lezárja őket.
window.addEventListener('mouseup', ()=>{ if(painting) endPaint(); if(draftRect) finalizeRect(); });
window.addEventListener('blur', ()=>{ if(painting) endPaint(); if(draftRect){ draftRect.destroy(); draftRect=null; overlay.batchDraw(); } });
stage.on('click tap', e=>{
  if(mode==='stamp'){ if(e.evt && e.evt.button===1) return; placeStamp(); return; }
  if(mode==='select'){ if(e.target===stage) select(null); return; }
  const p=worldPointer();
  if(mode==='terrain-poly'){ polyPts.push(p.x,p.y); refreshPolyPreview(); }
  else if(mode==='wall'){ let np=snapP(p); if(shiftDown&&wallPts.length)np=snapP(angleLock(wallPts[wallPts.length-1],p)); wallPts.push(np); refreshWallPreview(); }
});
stage.on('dblclick dbltap', ()=>{ if(mode==='terrain-poly')finalizePoly(); else if(mode==='wall')finalizeWall(); });
function cancelDraft(){ polyPts=[]; wallPts=[]; painting=false; polyPreview=null; wallPreview=null; draftRect=null; clearDrafts(); }

document.addEventListener('keydown', e=>{
  if(e.key==='Shift') shiftDown=true;
  if(e.key==='Enter'){ if(mode==='terrain-poly')finalizePoly(); else if(mode==='wall')finalizeWall(); }
  else if(e.key==='Escape'){ if(mode==='stamp'){ setMode('select'); } else cancelDraft(); }
  else if((e.key==='Delete'||e.key==='Backspace') && mode==='select' && selected()){ e.preventDefault(); deleteSelected(); }
  else if((e.key==='r'||e.key==='R') && mode==='stamp'){ stampRot=(stampRot+90)%360; moveGhost(); }
  else if((e.key==='r'||e.key==='R') && mode==='select' && selected()){ const n=selected(); n.rotation((Math.round(n.rotation()/90)*90+90)%360); mainLayer.batchDraw(); }
  else if((e.key==='v'||e.key==='V') && mode!=='stamp') setMode('select');
});
document.addEventListener('keyup', e=>{ if(e.key==='Shift') shiftDown=false; });

/* =========================================================
   MŰVELETEK / PAN-ZOOM
========================================================= */
function deleteSelected(){ const n=selected(); if(n){ n.destroy(); select(null); mainLayer.batchDraw(); updateCount(); } }
function bringFront(){ const n=selected(); if(n){ n.moveToTop(); tr.moveToTop(); mainLayer.batchDraw(); } }
function sendBack(){ const n=selected(); if(n){ n.moveToBottom(); mainLayer.batchDraw(); } }
let gridOn=true;
document.getElementById('gridBtn').onclick=function(){ gridOn=!gridOn; gridLayer.visible(gridOn); gridLayer.batchDraw(); this.classList.toggle('on',gridOn); };
function viewportCenterWorld(){ const s=stage.scaleX(); return { x:(stage.width()/2-stage.x())/s, y:(stage.height()/2-stage.y())/s }; }
function resetView(){ const pad=40, sc=Math.min((stage.width()-pad)/WORLD,(stage.height()-pad)/WORLD); stage.scale({x:sc,y:sc}); stage.position({x:(stage.width()-WORLD*sc)/2,y:(stage.height()-WORLD*sc)/2}); stage.batchDraw(); }
function zoomAt(ns, cx, cy){ const old=stage.scaleX(); const to={x:(cx-stage.x())/old,y:(cy-stage.y())/old}; ns=Math.max(0.15,Math.min(4,ns)); stage.scale({x:ns,y:ns}); stage.position({x:cx-to.x*ns,y:cy-to.y*ns}); stage.batchDraw(); }
function zoomBy(f){ zoomAt(stage.scaleX()*f, stage.width()/2, stage.height()/2); }
stage.on('wheel', e=>{ e.evt.preventDefault();
  if(mode==='stamp' && stampKey){ stampScale=Math.max(0.12,Math.min(24, stampScale*(e.evt.deltaY>0?0.88:1.14))); moveGhost(); return; }
  const pt=stage.getPointerPosition(); zoomAt(stage.scaleX()*(e.evt.deltaY>0?1/1.1:1.1), pt.x, pt.y);
});

/* Kétujjas PINCH-zoom + pan (tablet). A két ujj közepéhez zoomol, és a
   közép elmozdulásával panol. Működik vetítő módban és szerkesztéskor is. */
let _pinchDist=0, _pinchCenter=null;
function _touchMid(t1,t2){
  const rect = stage.container().getBoundingClientRect();
  return { x:(t1.clientX+t2.clientX)/2 - rect.left, y:(t1.clientY+t2.clientY)/2 - rect.top };
}
stage.on('touchmove', e=>{
  const ts = e.evt.touches;
  if(ts && ts.length>=2){
    e.evt.preventDefault();
    if(stage.isDragging()) stage.stopDrag();
    const t1=ts[0], t2=ts[1];
    const dist=Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY);
    const mid=_touchMid(t1,t2);
    if(_pinchDist){
      // Zoom a közép köré:
      zoomAt(stage.scaleX()*(dist/_pinchDist), mid.x, mid.y);
      // Pan a közép elmozdulásával:
      if(_pinchCenter){ stage.position({ x:stage.x()+(mid.x-_pinchCenter.x), y:stage.y()+(mid.y-_pinchCenter.y) }); stage.batchDraw(); }
    }
    _pinchDist=dist; _pinchCenter=mid;
  }
});
stage.on('touchend', e=>{ if(!e.evt.touches || e.evt.touches.length<2){ _pinchDist=0; _pinchCenter=null; } });

/* =========================================================
   MENTÉS / BETÖLTÉS
========================================================= */
function serialize(){ const items=[];
  mainLayer.getChildren().forEach(n=>{ const k=n.getAttr('kind');
    if(k==='asset') items.push({t:'asset',key:n.getAttr('assetKey'),x:n.x(),y:n.y(),rotation:n.rotation(),sx:n.scaleX(),sy:n.scaleY()});
    else if(k==='door') items.push({t:'door',key:n.getAttr('assetKey'),x:n.x(),y:n.y(),rotation:n.getAttr('baseRotation'),isOpen:n.getAttr('isOpen'),sx:n.scaleX(),sy:n.scaleY()});
    else if(k==='wall') items.push({t:'wall',mat:n.getAttr('mat'),thick:n.getAttr('thick'),x:n.x(),y:n.y(),w:n.width(),rotation:n.rotation(),sx:n.scaleX(),sy:n.scaleY()}); });
  // Mentéskor a talaj + a KÜLÖN blend-réteg egy PNG-be simul (a blend-réteg csak futásidőben,
  // a typeGrid-ből számolt segédréteg — a rács maga nem menthető, ld. fenti megjegyzés).
  const flat=document.createElement('canvas'); flat.width=WORLD; flat.height=WORLD;
  const fc=flat.getContext('2d'); fc.drawImage(terr,0,0); fc.drawImage(blend,0,0);
  return { version:3, bg:bgRect.fill(), grid:gridOn, terrain:flat.toDataURL('image/png'), items };
}
// Manuális JSON mentés/betöltés (a serialize/deserialize-t használja, mint a DB-út).
function exportSceneJson(){
  try {
    const blob = new Blob([JSON.stringify(serialize())], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'battlemap_' + new Date().toISOString().slice(0,10) + '.json';
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  } catch(e){ alert('Mentés sikertelen: ' + e.message); }
}
function importSceneJson(e){
  const file = e.target.files && e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const scene = JSON.parse(ev.target.result);
      if(!scene || !Array.isArray(scene.items)) throw new Error('Nem battlemap-JSON (hiányzik az items).');
      deserialize(scene); mainLayer.batchDraw(); if(typeof updateCount==='function') updateCount();
    } catch(err){ alert('Betöltés sikertelen: ' + err.message); }
  };
  r.readAsText(file); e.target.value='';
}
function deserialize(scene){ mainLayer.destroyChildren(); mainLayer.add(tr); select(null);
  bgRect.fill(scene.bg||'#3f6b3a'); bgLayer.batchDraw();
  gridOn=scene.grid!==false; gridLayer.visible(gridOn); document.getElementById('gridBtn').classList.toggle('on',gridOn);
  tctx.clearRect(0,0,WORLD,WORLD); bctx.clearRect(0,0,WORLD,WORLD); typeGrid.fill(0);
  // crossOrigin: a Storage-ból jövő kép nélküle "megmérgezné" a canvast, és a
  // következő mentés toDataURL()-je SecurityError-ral elszállna.
  if(scene.terrain){ const im=new Image(); im.crossOrigin='anonymous';
    im.onload=()=>{ tctx.drawImage(im,0,0); terrDraw(); };
    im.onerror=()=>toast('⚠️ A terep-kép nem tölthető be');
    im.src=scene.terrain; }
  (scene.items||[]).forEach(it=>{ if(it.t==='asset'&&ASSETS[it.key]) makeAsset(it.key,it.x,it.y,{rotation:it.rotation,scaleX:it.sx,scaleY:it.sy});
    else if(it.t==='door') makeDoor(it.key||'door_plain',it.x,it.y,{rotation:it.rotation,isOpen:it.isOpen,scaleX:it.sx,scaleY:it.sy});
    else if(it.t==='wall'){ const mat=WALL_TEXTURES[it.mat] ? it.mat : (it.tex && it.tex.startsWith('wood') ? 'wood' : (WALL_TEXTURES[it.tex]?it.tex:'stone'));
      makeWallSegment(it.x,it.y,it.w,it.rotation,mat,{scaleX:it.sx,scaleY:it.sy,thick:it.thick}); } });
  mainLayer.batchDraw(); updateCount();
}
/* =========================================================
   SUPABASE MENTÉS / BETÖLTÉS
   - A terep-kép (2560×2560, PNG-ként ~7MB) NEM az adatbázisba megy, hanem a
     'battlemaps' Storage bucketbe WEBP-ként (~3MB). Az adatbázisban csak a
     metaadat + az elemek + egy pici bélyegkép van, így a lista-lekérdezés gyors
     és a DB-kvóta nem fogy el. A Storage-URL állandó — erre tud majd az Ynev
     térkép hivatkozni.
   - Cross-origin canvas: a Storage másik domainről jön, ezért a betöltött képnél
     KÖTELEZŐ a crossOrigin='anonymous', különben a canvas "tainted" lesz és a
     KÖVETKEZŐ mentés toDataURL()-je biztonsági hibával elszáll.
========================================================= */
const BUCKET = 'battlemaps', THUMB_PX = 320;
let currentMapId = null, currentMapName = '';
// Kampány-kontextus: ha a KM Pultból ?campaign=<id>-vel nyíltunk meg, minden
// ITT mentett térkép automatikusan hozzákapcsolódik a kampányhoz (campaign_items).
const campaignCtx = new URLSearchParams(location.search).get('campaign');

// A jelenet metaadata terep-kép NÉLKÜL (ez megy a jsonb oszlopba, pár KB).
function sceneMeta(){ const s = serialize(); delete s.terrain; return s; }

function terrainBlob(){
  const c=document.createElement('canvas'); c.width=WORLD; c.height=WORLD;
  const x=c.getContext('2d'); x.drawImage(terr,0,0); x.drawImage(blend,0,0);
  return new Promise(res=> c.toBlob(res,'image/webp',0.85));
}

// Bélyegkép: háttérszín + terep + elemek egy 320px-es képbe.
function makeThumb(){
  const prevSel=selected(); select(null);
  const sc=stage.scaleX(), pos=stage.position();
  stage.scale({x:1,y:1}); stage.position({x:0,y:0});
  let objects=null;
  try{ objects = mainLayer.toCanvas({x:0,y:0,width:WORLD,height:WORLD,pixelRatio:THUMB_PX/WORLD}); }
  catch(e){ objects=null; }
  stage.scale({x:sc,y:sc}); stage.position(pos); stage.batchDraw();
  if(prevSel) select(prevSel);

  const c=document.createElement('canvas'); c.width=THUMB_PX; c.height=THUMB_PX;
  const x=c.getContext('2d');
  x.fillStyle=bgRect.fill(); x.fillRect(0,0,THUMB_PX,THUMB_PX);
  x.drawImage(terr,0,0,THUMB_PX,THUMB_PX);
  x.drawImage(blend,0,0,THUMB_PX,THUMB_PX);
  if(objects) x.drawImage(objects,0,0,THUMB_PX,THUMB_PX);
  return c.toDataURL('image/webp',0.7);
}

// TELJES PILLANATKÉP: háttér + terep + MINDEN lerakott asset, nagy felbontásban.
// Ezt tölti fel a mentés (snapshot_url), és erre vág a főoldali csempe-kivágó —
// így a csempén tényleg a kész pálya (asszetekkel együtt) látszik.
function snapshotBlob(px){
  px = px || 1600;
  const prevSel=selected(); select(null);
  const sc=stage.scaleX(), pos=stage.position();
  stage.scale({x:1,y:1}); stage.position({x:0,y:0});
  let objects=null;
  try{ objects = mainLayer.toCanvas({x:0,y:0,width:WORLD,height:WORLD,pixelRatio:px/WORLD}); }
  catch(e){ objects=null; }
  stage.scale({x:sc,y:sc}); stage.position(pos); stage.batchDraw();
  if(prevSel) select(prevSel);

  const c=document.createElement('canvas'); c.width=px; c.height=px;
  const x=c.getContext('2d');
  x.fillStyle=bgRect.fill(); x.fillRect(0,0,px,px);
  x.drawImage(terr,0,0,px,px);
  x.drawImage(blend,0,0,px,px);
  if(objects) x.drawImage(objects,0,0,px,px);
  return new Promise(res=> c.toBlob(res,'image/webp',0.82));
}

function openDlg(id){ document.getElementById(id).classList.add('open'); }
function closeDlg(id){ document.getElementById(id).classList.remove('open'); }

function openSaveDlg(){
  const inp=document.getElementById('mapNameInput');
  inp.value = currentMapName || '';
  document.getElementById('saveSub').textContent = currentMapId
    ? 'A megnyitott térképet írod felül — vagy adj új nevet és mentsd újként.'
    : 'Adj nevet a térképnek — ezzel fogod megtalálni a KM Pultban.';
  document.getElementById('saveConfirmBtn').textContent = currentMapId ? '💾 Felülírás' : '💾 Mentés';
  openDlg('saveMask'); setTimeout(()=>inp.focus(),50);
}

async function confirmSave(){
  const name=document.getElementById('mapNameInput').value.trim();
  if(!name){ toast('⚠️ Adj nevet a térképnek'); return; }
  const published=document.getElementById('mapPublished').checked;
  const btn=document.getElementById('saveConfirmBtn');
  btn.disabled=true; btn.textContent='Mentés…';
  try{
    // Ha megnyitott térképnél MÁS nevet adsz, az új térképként mentődik (nem felülírás).
    const isRename = currentMapId && name !== currentMapName;
    const id = (currentMapId && !isRename) ? currentMapId : crypto.randomUUID();
    const path = `${id}.webp`;
    const blob = await terrainBlob();
    const up = await sb.storage.from(BUCKET).upload(path, blob, { upsert:true, contentType:'image/webp' });
    if(up.error) throw up.error;
    const { data:{ publicUrl } } = sb.storage.from(BUCKET).getPublicUrl(path);

    // Teljes pillanatkép (terep + assetek) — ezt használja a főoldali csempe + kivágó.
    let snapshotUrl = null;
    try{
      const snapPath = `${id}_snap.webp`;
      const snapBlob = await snapshotBlob(1600);
      const snapUp = await sb.storage.from(BUCKET).upload(snapPath, snapBlob, { upsert:true, contentType:'image/webp' });
      if(!snapUp.error) snapshotUrl = sb.storage.from(BUCKET).getPublicUrl(snapPath).data.publicUrl;
    }catch(e){ console.warn('Pillanatkép mentése kimaradt:', e); }

    const row = {
      id, owner_id: window._userId, name,
      scene: sceneMeta(), thumb: makeThumb(),
      terrain_url: publicUrl, snapshot_url: snapshotUrl, published,
      updated_at: new Date().toISOString()
    };
    const { error } = await sb.from('battlemaps').upsert(row);
    if(error) throw error;
    // Kampányhoz kötés. A UNIQUE(campaign_id,item_type,item_id) miatt az ismételt
    // mentés nem duplikál — a már meglévő kapcsolat hibáját szándékosan elnyeljük.
    if(campaignCtx){
      const link = await sb.from('campaign_items')
        .insert({ campaign_id:campaignCtx, item_type:'battlemap', item_id:id });
      if(link.error && link.error.code!=='23505') console.warn('Kampányhoz kötés:', link.error.message);
    }
    currentMapId=id; currentMapName=name;
    closeDlg('saveMask'); toast('💾 Elmentve: '+name+(campaignCtx?' (kampányhoz kötve)':''));
  }catch(e){
    console.error(e); toast('⚠️ Mentés sikertelen: '+(e.message||e));
  }finally{
    btn.disabled=false; btn.textContent = currentMapId ? '💾 Felülírás' : '💾 Mentés';
  }
}

async function openLoadDlg(){
  openDlg('loadMask');
  const list=document.getElementById('mapList');
  list.innerHTML='<div class="empty">Betöltés…</div>';
  const { data, error } = await sb.from('battlemaps')
    .select('id,name,thumb,published,updated_at').order('updated_at',{ascending:false});
  if(error){ list.innerHTML=`<div class="empty">⚠️ ${error.message}</div>`; return; }
  if(!data || !data.length){ list.innerHTML='<div class="empty">Még nincs mentett battlemap.</div>'; return; }
  list.innerHTML='';
  data.forEach(m=>{
    const row=document.createElement('div'); row.className='maprow';
    const d=new Date(m.updated_at).toLocaleString('hu-HU',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    row.innerHTML=`<img src="${m.thumb||''}" alt="">
      <div class="mi"><div class="mn">${escapeHtml(m.name)}${m.published?'<span class="badge">közzétéve</span>':''}</div>
      <div class="md">${d}</div></div>
      <button class="mdel" title="Törlés">🗑</button>`;
    row.querySelector('img').onerror=function(){ this.style.visibility='hidden'; };
    row.onclick=()=>loadMap(m.id);
    row.querySelector('.mdel').onclick=async ev=>{ ev.stopPropagation();
      if(!confirm(`Törlöd a(z) "${m.name}" térképet?`)) return;
      await sb.storage.from(BUCKET).remove([`${m.id}.webp`]);
      const { error } = await sb.from('battlemaps').delete().eq('id',m.id);
      if(error){ toast('⚠️ '+error.message); return; }
      if(currentMapId===m.id){ currentMapId=null; currentMapName=''; }
      toast('🗑 Törölve'); openLoadDlg();
    };
    list.appendChild(row);
  });
}

async function loadMap(id){
  const { data, error } = await sb.from('battlemaps').select('*').eq('id',id).single();
  if(error){ toast('⚠️ '+error.message); return; }
  setMode('select');
  const scene = data.scene || {};
  // Cache-busting: felülírás után a régi kép maradna a böngésző gyorsítótárában.
  scene.terrain = data.terrain_url ? data.terrain_url+'?v='+Date.parse(data.updated_at) : null;
  deserialize(scene);
  currentMapId=data.id; currentMapName=data.name;
  document.getElementById('mapPublished').checked = !!data.published;
  closeDlg('loadMask'); toast('📂 Betöltve: '+data.name);
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Modál-billentyűk: Enter = mentés, Esc = bezár. Capture fázisban, hogy a
// szerkesztő globális Esc/Delete kezelője ne szóljon bele nyitott modálnál.
document.addEventListener('keydown', e=>{
  const open=document.querySelector('.mask.open');
  if(!open) return;
  if(e.key==='Escape'){ e.stopPropagation(); closeDlg(open.id); }
  else if(e.key==='Enter' && open.id==='saveMask'){ e.stopPropagation(); confirmSave(); }
}, true);
// Háttérre kattintva is bezárul
document.querySelectorAll('.mask').forEach(m=>{
  m.addEventListener('mousedown', e=>{ if(e.target===m) closeDlg(m.id); });
});
function clearScene(){ if(!confirm('Üríted a csatateret?'))return; tctx.clearRect(0,0,WORLD,WORLD); bctx.clearRect(0,0,WORLD,WORLD); typeGrid.fill(0); terrDraw(); mainLayer.destroyChildren(); mainLayer.add(tr); select(null); mainLayer.batchDraw(); updateCount();
  currentMapId=null; currentMapName=''; document.getElementById('mapPublished').checked=false; }

/* =========================================================
   UI FELÉPÍTÉS
========================================================= */
function buildToolRail(){
  const rail=document.getElementById('toolrail');
  TOOLS.forEach(t=>{
    if(t.sep){ const s=document.createElement('div'); s.className='railsep'; rail.appendChild(s); return; }
    const b=document.createElement('button'); b.className='tool'+(t.mode==='select'?' on':''); b.dataset.mode=t.mode;
    b.innerHTML=`${t.icon}<span class="lbl">${t.label}</span>`;
    b.onclick=()=>{ if(t.mode==='stamp'){ setMode('stamp'); if(!stampKey){ setStamp(CATEGORIES[stampCat][0]); } } else setMode(t.mode); };
    rail.appendChild(b);
  });
}
const LIB_META = {
  select:{t:'Kijelölés', s:'Mozgat · forgat · méretez'},
  stamp:{t:'Elemek', s:'Válaszd ki, majd kattints a térképre'},
  brush:{t:'Ecset', s:'Talaj festése', tip:'Nyomd le és húzd. A fehér gyűrű mutatja a méretet.'},
  eraser:{t:'Radír', s:'Festett talaj törlése', tip:'Nyomd le és húzd a piros gyűrűvel a törléshez.'},
  'terrain-rect':{t:'Terület', s:'Textúrázott téglalap', tip:'HÚZZ egy téglalapot → kitölti a kijelölt textúrával.'},
  'terrain-poly':{t:'Folt', s:'Szabálytalan textúrázott folt', tip:'Kattints a sarokpontokra, majd DUPLA KATT / Enter = kész.'},
  wall:{t:'Fal', s:'Anyag kiválasztása', tip:'Kattints a sarkokra (Shift = szög-lock), dupla katt / Enter = kész.'},
};
function renderLibrary(){
  const lib=document.getElementById('library'); const meta=LIB_META[mode]||LIB_META.select;
  const head=`<div class="lib-head"><div class="lib-title">${meta.t}</div><div class="lib-sub">${meta.s}</div></div>`;
  const tip = meta.tip ? `<div class="lib-tip">💡 ${meta.tip}</div>` : '';
  const texGridHTML = `<div class="lib-sec-title">Textúra</div><div class="swgrid" id="texGrid"></div>`;
  const brushHTML = `<div class="field"><label>Ecset méret <span>${brushSize}px</span></label><input type="range" id="brushSize" min="24" max="360" value="${brushSize}"></div>`;
  const bgHTML = `<div class="lib-sec-title">Alap háttér</div><div class="bgrow" id="bgRow"></div>`;
  const sharpHTML = `<label class="field" style="flex-direction:row;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="sharpEdgeChk"${sharpEdge?' checked':''}> Éles szél (nincs elmosás)</label>`;

  if(mode==='stamp'){
    lib.innerHTML=`${head}<div class="lib-body">${tip}
      <div class="tabs">${Object.keys(CATEGORIES).map(c=>`<div class="tab${c===stampCat?' on':''}" data-cat="${c}">${c}</div>`).join('')}</div>
      <div class="swgrid" id="stampGrid"></div>
      <div class="lib-tip" style="margin-top:2px">Görgő = méret · R = 90° · görgő-húzás = szabad forgatás (${stampRot.toFixed(0)}°) · Esc = kilép</div></div>`;
    const grid=lib.querySelector('#stampGrid');
    CATEGORIES[stampCat].forEach(k=>{ const d=document.createElement('div'); d.className='sw el'+(k===stampKey?' on':''); d.title=ASSETS[k].label;
      d.innerHTML=`<img src="${ASSETS[k].src}"><span class="cap">${ASSETS[k].label}</span>`; d.onclick=()=>setStamp(k); grid.appendChild(d); });
    lib.querySelectorAll('.tab').forEach(t=> t.onclick=()=>{ stampCat=t.dataset.cat; renderLibrary(); });
  }
  else if(mode==='eraser'){
    lib.innerHTML=`${head}<div class="lib-body">${tip}${brushHTML}</div>`;
    wireBrush(lib);
  }
  else if(mode==='brush' || mode==='terrain-rect' || mode==='terrain-poly'){
    const showBrush = (mode==='brush');
    const showSharp = (mode==='terrain-rect' || mode==='terrain-poly');
    lib.innerHTML=`${head}<div class="lib-body">${tip}${texGridHTML}${showSharp?sharpHTML:''}${showBrush?brushHTML:''}${bgHTML}</div>`;
    const grid=lib.querySelector('#texGrid');
    Object.entries(TEXTURES).forEach(([k,def])=>{ const d=document.createElement('div'); d.className='sw'+(k===currentTex?' on':''); d.title=def.label;
      d.innerHTML=`<img src="${def.src}"><span class="cap">${def.label}</span>`; d.onclick=()=>{ currentTex=k; renderLibrary(); }; grid.appendChild(d); });
    if(showSharp){ const chk=lib.querySelector('#sharpEdgeChk'); chk.onchange=()=>{ sharpEdge=chk.checked; }; }
    if(showBrush) wireBrush(lib);
    const bg=lib.querySelector('#bgRow'); BG_COLORS.forEach(c=>{ const s=document.createElement('div'); s.className='bgsw'; s.style.background=c; s.onclick=()=>{bgRect.fill(c);bgLayer.batchDraw();}; bg.appendChild(s); });
  }
  else if(mode==='wall'){
    // A fal-anyag KÜLÖN a padló-textúráktól (WALL_TEXTURES) + állítható vastagság — új faltól kezdve.
    lib.innerHTML=`${head}<div class="lib-body">${tip}
      <div class="lib-sec-title">Fal anyaga</div><div class="swgrid" id="wallMatGrid"></div>
      <div class="field"><label>Vastagság <span id="wallThickVal">${wallThick}px</span></label><input type="range" id="wallThickRange" min="6" max="48" value="${wallThick}"></div></div>`;
    const grid=lib.querySelector('#wallMatGrid');
    Object.entries(WALL_TEXTURES).forEach(([k,def])=>{ const d=document.createElement('div'); d.className='sw'+(k===wallMat?' on':''); d.title=def.label;
      d.innerHTML=`<img src="${def.src}"><span class="cap">${def.label}</span>`; d.onclick=()=>{ wallMat=k; renderLibrary(); }; grid.appendChild(d); });
    const thickRange=lib.querySelector('#wallThickRange');
    thickRange.oninput=()=>{ wallThick=+thickRange.value; lib.querySelector('#wallThickVal').textContent=wallThick+'px'; };
  }
  else {
    const sel=selected();
    const wallSelected = sel && sel.getAttr('kind')==='wall';
    const doorSelected = sel && sel.getAttr('kind')==='door';
    let extra='';
    if(wallSelected){
      extra=`<div class="lib-sec-title">Kijelölt fal anyaga</div><div class="swgrid" id="wallMatGridSel"></div>
        <div class="field"><label>Vastagság <span id="wallThickValSel">${sel.getAttr('thick')}px</span></label><input type="range" id="wallThickRangeSel" min="6" max="48" value="${sel.getAttr('thick')}"></div>`;
    } else if(doorSelected){
      const isOpen=sel.getAttr('isOpen');
      extra=`<button class="tbtn" id="doorToggleBtn" style="width:100%;margin-bottom:8px">🚪 ${isOpen?'Becsukás':'Kinyitás'}</button>`;
    }
    lib.innerHTML=`${head}<div class="lib-body"><div class="lib-empty">Kattints egy elemre vagy falra a szerkesztéshez.<br><br>Bal oldalt: fesd a talajt, rakj le elemet, húzz falat.<br><br>Kijelölve: húzd a forgató fogantyút (45°-onként kattan), vagy nyomd meg <b>R</b>-t a pontos 90°-os forgatáshoz.</div>
      ${extra}
      <div class="lib-sec-title">Réteg-sorrend</div>
      <div style="display:flex;gap:6px"><button class="tbtn" onclick="bringFront()" style="flex:1">⬆ Előre</button><button class="tbtn" onclick="sendBack()" style="flex:1">⬇ Hátra</button></div>
      <button class="tbtn danger" onclick="deleteSelected()">🗑 Kijelölt törlése</button></div>`;
    if(wallSelected){
      const grid=lib.querySelector('#wallMatGridSel');
      Object.entries(WALL_TEXTURES).forEach(([k,def])=>{ const d=document.createElement('div'); d.className='sw'+(k===sel.getAttr('mat')?' on':''); d.title=def.label;
        d.innerHTML=`<img src="${def.src}"><span class="cap">${def.label}</span>`;
        d.onclick=()=>{ sel.setAttr('mat',k); sel.fillPatternImage(wallTexImg(k)); sel.getLayer().batchDraw(); renderLibrary(); }; grid.appendChild(d); });
      const tr2=lib.querySelector('#wallThickRangeSel');
      tr2.oninput=()=>{ const v=+tr2.value; sel.setAttr('thick',v); sel.height(v); sel.offsetY(v/2); sel.getLayer().batchDraw(); lib.querySelector('#wallThickValSel').textContent=v+'px'; };
    } else if(doorSelected){
      lib.querySelector('#doorToggleBtn').onclick=()=>toggleDoor(sel);
    }
  }
}
function wireBrush(lib){ const bs=lib.querySelector('#brushSize'); if(!bs)return;
  bs.oninput=()=>{ brushSize=+bs.value; bs.previousElementSibling.querySelector('span').textContent=bs.value+'px'; if(cursorRing){cursorRing.radius(brushSize/2);overlay.batchDraw();} }; }
function updateCount(){ document.getElementById('countTag').textContent = mainLayer.getChildren(x=>x.getAttr('kind')).length+' elem'; }
let _tt=null; function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.style.opacity='1'; clearTimeout(_tt); _tt=setTimeout(()=>el.style.opacity='0',1600); }
window.addEventListener('resize', ()=>{ stage.width(wrap.clientWidth); stage.height(wrap.clientHeight); stage.batchDraw(); });

/* =========================================================
   VETÍTŐ MÓD (cast) — a KM Pult iframe-je üzenetben kapcsolja.
   Csak a battlemap + egy Vissza gomb; a háttér nem húzható (nincs
   panolás/zoom), hogy vetítéskor ne mozduljon el a kép.
========================================================= */
let _castOn=false;
function fitStageToWrap(){ stage.width(wrap.clientWidth); stage.height(wrap.clientHeight); stage.batchDraw(); }
function applyCast(on){
  _castOn = !!on;
  document.body.classList.toggle('cast-mode', _castOn);
  if (_castOn){
    // Vetítéskor: nézet mozgatható (pan) és nagyítható (pinch/görgő), DE a
    // térkép-elemek NEM húzhatók (ne mozduljanak el véletlenül vetítés közben).
    select(null);
    stage.draggable(true);
    mainLayer.getChildren().forEach(n=>{ if(n!==tr) n.draggable(false); });
  } else {
    setMode(mode);   // visszaállítja a húzhatóságot / kurzort a mód szerint
  }
  // A panelek eltűntével/visszatértével változik a vászon mérete → átméretezés,
  // majd belépéskor középre igazítás (fit az egész térképre).
  const settle = () => { fitStageToWrap(); if (_castOn) resetView(); };
  requestAnimationFrame(settle);
  setTimeout(settle, 140);
  setTimeout(settle, 400);
}
window.exitCast = function(){
  applyCast(false);
  try { if (window.parent && window.parent !== window) window.parent.postMessage({ type:'CAST_EXIT' }, '*'); } catch(e){}
  try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); } catch(e){}
};
window.addEventListener('message', e=>{
  const d = e.data || {};
  if (d.type === 'CAST_MODE') applyCast(!!d.on);
});

/* =========================================================
   TABLET: behúzható Tár (library) fiók
========================================================= */
function isCoarse(){ return window.matchMedia('(max-width: 860px), (pointer: coarse)').matches; }
window.toggleLibrary = function(force){
  const lib = document.getElementById('library');
  const bd  = document.getElementById('libBackdrop');
  if (!lib) return;
  const open = (force === undefined) ? !lib.classList.contains('open') : !!force;
  lib.classList.toggle('open', open);
  if (bd) bd.classList.toggle('on', open);
  const t = document.getElementById('libToggle');
  if (t) t.textContent = open ? '✕ Bezár' : '📚 Tár';
};
// A Tárat használó eszközök kiválasztásakor (tableten) nyíljon ki a fiók.
const _LIB_TOOLS = new Set(['stamp','brush','terrain-rect','terrain-poly','wall']);

/* =========================================================
   INDÍTÁS
========================================================= */
(async ()=>{
  buildTextures(); // procedurális textúrák generálása (felülírja az SVG-ket)
  await Promise.all([ ...Object.values(TEXTURES).map(t=>loadImg(t.src)), ...Object.values(ASSETS).map(a=>loadImg(a.src)), ...Object.values(WALL_TEXTURES).map(t=>loadImg(t.src)) ]);
  // Valós fotó-textúrák (fű/fa/víz/fal) varratmentesítése betöltés után — a cache-ben lecseréljük
  // az eredeti képet a feldolgozott (offset+heal) canvasra, ezért minden downstream helyen
  // (paintStamp, paintRegion, fal-kitöltés, könyvtár-thumbnail) automatikusan érvényesül.
  // A már eleve varratmentes (user-szolgáltatott, AI-generált) textúrákat NEM dolgozzuk fel —
  // a makeSeamless() a KÖZEPÉRE tenne egy felesleges (és akár árt is) elmosott heal-sávot.
  TEX_KEY_LIST.filter(k=>!PROCEDURAL_KEYS.includes(k) && !TEXTURES[k].seamless).forEach(k=>{ const src=TEXTURES[k].src; imgCache[src]=makeSeamless(imgCache[src]); });
  Object.values(WALL_TEXTURES).forEach(t=>{ imgCache[t.src]=makeSeamless(imgCache[t.src]); });
  buildToolRail(); drawGrid(); resetView(); updateCount(); setMode('select');
  // A KM Pultból ?map=<uuid>-vel érkezve rögtön a kért térképet nyitjuk meg.
  await window._authReady;
  const wanted = new URLSearchParams(location.search).get('map');
  if(wanted) loadMap(wanted);
})();
</script>
